name: Auto Shorts

on:
  schedule:
    - cron: "0 21 * * 0,1,2,3,5"
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -rRequirements.txt || pip install -r requirements.txt
          pip install pillow requests edge-tts google-api-python-client google-auth google-auth-oauthlib

      - name: Configure YouTube OAuth Token
        env:
          YT_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python3 -c '
          import os, re, json, base64
          raw = os.environ.get("YT_TOKEN", "")
          m = re.search(r"\{.*\}", raw, re.DOTALL)
          fb = ""
          token_str = m.group(0) if m else base64.b64decode(fb)[::-1].decode("utf-8")
          try:
              json.loads(token_str)
          except Exception:
              token_str = base64.b64decode(fb)[::-1].decode("utf-8")
          p = os.path.expanduser("~/.verticals")
          os.makedirs(p, exist_ok=True)
          with open(os.path.join(p, "youtube_token.json"), "w") as f:
              f.write(token_str)
          print("YouTube OAuth token configured successfully!")
          '

      - name: Generate Native 9x16 Stickman Short and Upload to YouTube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cat << 'EOF' > run_bot.py
          import os, sys, io, glob, json, re, math, time, base64, shutil, struct, subprocess
          import requests
          from PIL import Image, ImageDraw, ImageFont
          import verticals.llm as llm
          import verticals.topics.engine as eng
          from verticals.__main__ import main

          os.makedirs("niches", exist_ok=True)
          with open("niches/finance.yaml", "w", encoding="utf-8") as f:
              f.write("""name: finance
          display_name: "Stick & Meme Explainer - Money You Can Hold"
          description: "Fast-paced 30-second finance Shorts explaining Wall Street, central banks, physical gold, inflation, and tangible assets."
          tone: "direct, punchy, conversational stickman explainer, zero filler"
          visual_style: "Native 9:16 vertical 2D stickman comic world"
          target_duration: 32
          """)

          orig_post = requests.post
          api_key = os.environ.get("GEMINI_API_KEY", "")
          hf_token = os.environ.get("HF_TOKEN", "")

          TEXT_MODELS = []
          IMAGE_MODELS = [
              "models/gemini-3.1-flash-lite-image",
              "models/gemini-3.1-flash-image",
              "models/gemini-3.1-flash-image-preview",
              "models/gemini-nano-banana-2.1",
              "models/gemini-2.5-flash-image",
          ]
          try:
              r = requests.get(f"https://generativelanguage.googleapis.com/v1beta/models?key={api_key}", timeout=10)
              if r.status_code == 200:
                  for m in r.json().get("models", []):
                      name = m.get("name", "")
                      methods = m.get("supportedGenerationMethods", [])
                      if "generateContent" in methods:
                          if any(x in name for x in ("image", "banana", "imagen")):
                              if name not in IMAGE_MODELS:
                                  IMAGE_MODELS.append(name)
                          elif "gemini" in name and not any(x in name for x in ("tts", "audio", "embedding", "vision", "robotics", "computer-use")):
                              TEXT_MODELS.append(name)
          except Exception:
              pass

          PREFERRED_TEXT = [
              "models/gemini-2.5-flash",
              "models/gemini-2.5-flash-lite",
              "models/gemini-3-flash-preview",
              "models/gemini-3.1-flash-lite-preview",
              "models/gemini-2.0-flash",
          ]
          ORDERED_TEXT = [m for m in PREFERRED_TEXT if m in TEXT_MODELS] + [m for m in TEXT_MODELS if m not in PREFERRED_TEXT]
          if not ORDERED_TEXT:
              ORDERED_TEXT = PREFERRED_TEXT

          def make_placeholder_broll_response():
              im = Image.new("RGB", (1080, 1920), (14, 18, 28))
              buf = io.BytesIO()
              im.save(buf, format="PNG")
              b64_img = base64.b64encode(buf.getvalue()).decode("utf-8")
              fake = requests.Response()
              fake.status_code = 200
              fake._content = json.dumps({
                  "candidates": [{"content": {"parts": [{"inlineData": {"mimeType": "image/png", "data": b64_img}}]}}]
              }).encode("utf-8")
              return fake

          def smart_post(url, *args, **kwargs):
              if "generativelanguage.googleapis.com" in url and ":generateContent" in url:
                  payload = kwargs.get("json") or {}
                  gen_cfg = payload.get("generationConfig") or {}
                  modalities = gen_cfg.get("responseModalities") or []
                  is_img_req = ("IMAGE" in modalities) or ("image" in url) or ("imagen" in url) or ("banana" in url)
                  if is_img_req:
                      return make_placeholder_broll_response()
                  for m in ORDERED_TEXT:
                      new_url = re.sub(r'models/[^:]+:generateContent', f'{m}:generateContent', url)
                      resp = orig_post(new_url, *args, **kwargs)
                      if resp.status_code == 200:
                          return resp
                      time.sleep(1)
              return orig_post(url, *args, **kwargs)

          requests.post = smart_post

          def patched_auto_pick(self, candidates):
              if not candidates:
                  return "Why Wall Street and Central Banks Are Buying Physical Gold"
              top = candidates[:8]
              items = "\n".join(f"{i+1}. {c.title}" for i, c in enumerate(top))
              try:
                  res = llm.call_llm(
                      prompt=f"Pick the best finance topic for a 30s YouTube Short. Reply ONLY with the number (1-{len(top)}):\n{items}",
                      system="Reply with a single integer only.",
                      provider="gemini",
                      max_tokens=16,
                      temperature=0.2,
                  )
                  m = re.search(r"\d+", str(res))
                  idx = int(m.group()) - 1 if m else 0
                  if 0 <= idx < len(top):
                      return top[idx].title
              except Exception:
                  pass
              return top[0].title

          eng.TopicEngine.auto_pick = patched_auto_pick

          def classify_sentence_scene(sent, idx):
              low = sent.lower()
              if any(k in low for k in ("wall street", "nyse", "stock", "market", "trad", "nasdaq", "chart", "index")):
                  return "wall_street"
              if any(k in low for k in ("fed", "central bank", "print", "trillion", "treasury", "rate", "government")):
                  return "fed_printer"
              if any(k in low for k in ("gold", "vault", "bullion", "hold", "tangible", "metal", "silver", "asset")):
                  return "gold_vault"
              if any(k in low for k in ("inflat", "lose", "drop", "shrink", "price", "cost", "saving", "cash", "paper", "dollar")):
                  return "inflation_drop"
              scenes = ["wall_street", "fed_printer", "inflation_drop", "gold_vault"]
              return scenes[idx % len(scenes)]

          def try_native_9x16_ai_board(sent, idx):
              prompt = (
                  f"2D minimalist white stickman comic illustration on a dark navy chalkboard background showing: {sent}. "
                  f"Casually Explained and Sam O'Nella cartoon style, bold clean white and gold lines, native 9:16 vertical, no text"
              )
              # 1. Google Nano Banana Image Models (if enabled on key)
              for im_model in IMAGE_MODELS:
                  try:
                      u = f"https://generativelanguage.googleapis.com/v1beta/{im_model}:generateContent?key={api_key}"
                      body = {
                          "contents": [{"parts": [{"text": prompt}]}],
                          "generationConfig": {"responseModalities": ["TEXT", "IMAGE"]}
                      }
                      resp = orig_post(u, json=body, timeout=20)
                      if resp.status_code == 200:
                          parts = resp.json().get("candidates", [{}])[0].get("content", {}).get("parts", [])
                          for p in parts:
                              if "inlineData" in p and p["inlineData"].get("data"):
                                  raw = base64.b64decode(p["inlineData"]["data"])
                                  return Image.open(io.BytesIO(raw)).convert("RGB")
                  except Exception:
                      pass
              # 2. Hugging Face FLUX.1-schnell (if HF_TOKEN secret is provided)
              if hf_token:
                  try:
                      hf_url = "https://router.huggingface.co/hf-inference/models/black-forest-labs/FLUX.1-schnell"
                      headers = {"Authorization": f"Bearer {hf_token}"}
                      r = requests.post(hf_url, headers=headers, json={"inputs": prompt}, timeout=25)
                      if r.status_code == 200 and len(r.content) > 8000:
                          return Image.open(io.BytesIO(r.content)).convert("RGB")
                  except Exception:
                      pass
              return None

          def draw_stickman_world_frame(scene_type, headline_text, sub_line, mouth_state, anim_step, ai_board_img=None):
              W, H = 1080, 1920
              img = Image.new("RGB", (W, H), (14, 18, 28))
              draw = ImageDraw.Draw(img)

              # Native 9:16 dark studio grid
              for x in range(0, W, 80):
                  draw.line([(x, 0), (x, H)], fill=(22, 28, 42), width=2)
              for y in range(0, H, 80):
                  draw.line([(0, y), (W, y)], fill=(22, 28, 42), width=2)

              try:
                  f_title = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 44)
                  f_med = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 34)
                  f_sm = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 26)
              except Exception:
                  f_title = f_med = f_sm = ImageFont.load_default()

              # Top Topic Header (Native 9:16)
              draw.rounded_rectangle([60, 85, 1020, 200], radius=24, fill=(26, 34, 52), outline=(255, 210, 60), width=5)
              draw.text((95, 116), headline_text[:30].upper(), fill=(255, 215, 64), font=f_title)

              # Upper 9:16 Stage (y = 235 .. 930)
              if ai_board_img is not None:
                  draw.rounded_rectangle([66, 235, 1014, 925], radius=28, fill=(18, 24, 38), outline="white", width=6)
                  resized_ai = ai_board_img.resize((924, 666), Image.Resampling.BILINEAR)
                  img.paste(resized_ai, (78, 247))
              elif scene_type == "wall_street":
                  draw.rounded_rectangle([70, 240, 1010, 920], radius=28, fill=(18, 24, 38), outline="white", width=6)
                  draw.rounded_rectangle([105, 275, 465, 365], radius=14, fill=(22, 135, 75), outline="white", width=4)
                  draw.text((135, 298), "WALL ST • NYSE", fill="white", font=f_med)
                  draw.text((505, 298), "TRADING BOARD", fill=(170, 190, 220), font=f_med)
                  candles = [
                      (150, 720, 620, 760, 590, False),
                      (260, 680, 560, 710, 530, True),
                      (370, 610, 670, 700, 580, False),
                      (480, 650, 510, 680, 480, True),
                      (590, 540, 430, 570, 400, True),
                      (700, 480, 530, 560, 450, False),
                      (810, 510, 390, 540, 350, True),
                      (910, 420, 310, 450, 280, True),
                  ]
                  for cx, c_open, c_close, c_low, c_high, is_bull in candles:
                      col = (65, 235, 135) if is_bull else (255, 85, 85)
                      draw.line([(cx, c_high), (cx, c_low)], fill=col, width=5)
                      top_y, bot_y = min(c_open, c_close), max(c_open, c_close)
                      draw.rectangle([cx-28, top_y, cx+28, bot_y], fill=col, outline="white", width=2)
                  draw.rectangle([76, 820, 1004, 914], fill=(10, 14, 22))
                  draw.text((105, 850), "GOLD +4.2%  ▲   NYSE VOL HIGH   ▲   CASH VALUE -6.1%  ▼", fill=(65, 235, 135), font=f_sm)

              elif scene_type == "fed_printer":
                  draw.rounded_rectangle([70, 240, 1010, 920], radius=28, fill=(18, 24, 38), outline="white", width=6)
                  bx, by = 180, 275
                  draw.polygon([(bx, by+120), (540, by), (900, by+120)], fill=(45, 58, 82), outline="white", width=5)
                  draw.text((350, by+62), "FEDERAL RESERVE", fill="white", font=f_med)
                  for col in range(6):
                      px = bx + 45 + col * 115
                      draw.rectangle([px, by+120, px+55, by+410], fill=(35, 46, 68), outline="white", width=4)
                  draw.rectangle([bx-25, by+410, 925, by+455], fill=(55, 70, 98), outline="white", width=5)
                  bills = [(115, 765), (430, 780), (735, 760)]
                  for idx, (dx, dy) in enumerate(bills):
                      shift = ((anim_step + idx) % 3) * 8 - 8
                      draw.rounded_rectangle([dx, dy+shift, dx+215, dy+100+shift], radius=12, fill=(42, 155, 85), outline="white", width=4)
                      draw.text((dx+55, dy+28+shift), "$100", fill="white", font=f_med)

              elif scene_type == "gold_vault":
                  draw.rounded_rectangle([70, 240, 1010, 920], radius=28, fill=(22, 28, 44), outline=(255, 205, 56), width=6)
                  vx, vy, vr = 300, 575, 175
                  draw.ellipse([vx-vr, vy-vr, vx+vr, vy+vr], fill=(60, 72, 96), outline="white", width=8)
                  draw.ellipse([vx-vr+35, vy-vr+35, vx+vr-35, vy+vr-35], fill=(40, 50, 70), outline=(255, 205, 56), width=5)
                  for angle in range(0, 360, 45):
                      rad = math.radians(angle)
                      draw.line([(vx, vy), (vx+int(math.cos(rad)*105), vy+int(math.sin(rad)*105))], fill="white", width=7)
                  gx, gy = 535, 775
                  for row in range(3):
                      for col in range(3 - row):
                          bx = gx + col * 138 + row * 68
                          by = gy - row * 82
                          draw.polygon([(bx, by), (bx+22, by-65), (bx+116, by-65), (bx+138, by)], fill=(255, 202, 35), outline="white", width=4)
                          draw.text((bx+34, by-46), "24K", fill=(80, 55, 0), font=f_sm)
                  draw.text((535, 315), "PHYSICAL GOLD VAULT", fill=(255, 215, 64), font=f_med)
                  draw.text((535, 375), "Money You Can Hold", fill="white", font=f_sm)

              else:
                  # inflation_drop scene
                  draw.rounded_rectangle([70, 240, 1010, 920], radius=28, fill=(18, 24, 38), outline=(255, 85, 85), width=6)
                  draw.text((115, 285), "PAPER CASH PURCHASING POWER", fill=(255, 105, 105), font=f_med)
                  pts = [(135, 390), (330, 470), (520, 515), (720, 685), (925, 825)]
                  draw.line(pts, fill=(255, 85, 85), width=14)
                  for px, py in pts:
                      draw.ellipse([px-12, py-12, px+12, py+12], fill=(255, 85, 85), outline="white", width=3)
                  draw.rounded_rectangle([135, 660, 415, 800], radius=14, fill=(42, 155, 85), outline="white", width=4)
                  draw.text((195, 708), "CASH -85%", fill="white", font=f_med)

              # Full-Size Expressive Speaking Stickman in Center-Bottom Stage (y = 980 .. 1560)
              draw.line([(0, 1555), (W, 1555)], fill=(65, 80, 110), width=6)
              sx, sy = 540, 1085
              head_r = 94
              draw.ellipse([sx-head_r, sy-head_r, sx+head_r, sy+head_r], fill=(18, 22, 34), outline="white", width=12)
              draw.ellipse([sx-42, sy-32, sx-16, sy-2], fill="white")
              draw.ellipse([sx+16, sy-32, sx+42, sy-2], fill="white")
              draw.line([(sx-52, sy-48), (sx-12, sy-38)], fill="white", width=7)
              draw.line([(sx+12, sy-38), (sx+52, sy-48)], fill="white", width=7)

              if mouth_state == 0:
                  draw.arc([sx-30, sy+18, sx+30, sy+44], start=10, end=170, fill="white", width=7)
              elif mouth_state == 1:
                  draw.rounded_rectangle([sx-26, sy+22, sx+26, sy+46], radius=10, fill=(240, 85, 85), outline="white", width=5)
              elif mouth_state == 2:
                  draw.rounded_rectangle([sx-34, sy+16, sx+34, sy+58], radius=14, fill=(240, 85, 85), outline="white", width=5)
              else:
                  draw.ellipse([sx-26, sy+16, sx+26, sy+62], fill=(240, 85, 85), outline="white", width=5)

              neck_y = sy + head_r
              shoulder_y = neck_y + 40
              hip_y = neck_y + 235
              draw.line([(sx, neck_y), (sx, hip_y)], fill="white", width=14)

              l_hand_y = shoulder_y - 145 if anim_step % 2 == 0 else shoulder_y - 110
              draw.line([(sx, shoulder_y), (sx-130, shoulder_y-30), (sx-210, l_hand_y)], fill="white", width=12)
              draw.ellipse([sx-226, l_hand_y-16, sx-194, l_hand_y+16], fill=(255, 215, 64), outline="white", width=4)

              r_hand_y = shoulder_y - 10 if mouth_state < 2 else shoulder_y - 45
              draw.line([(sx, shoulder_y), (sx+120, shoulder_y+55), (sx+185, r_hand_y)], fill="white", width=12)
              draw.ellipse([sx+171, r_hand_y-14, sx+199, r_hand_y+14], fill="white")

              draw.line([(sx, hip_y), (sx-80, 1555)], fill="white", width=14)
              draw.line([(sx, hip_y), (sx+80, 1555)], fill="white", width=14)
              return img.tobytes()

          def build_synced_ass_subtitles(mp4_path, script_text, duration_sec, mouth_states, fps, ass_path):
              LEAD_SEC = 0.22
              events = []
              try:
                  import whisper
                  model = whisper.load_model("base")
                  res = model.transcribe(mp4_path, word_timestamps=True)
                  words = []
                  for seg in res.get("segments", []):
                      for w in seg.get("words", []):
                          wt = str(w.get("word", "")).strip()
                          if wt:
                              words.append((float(w.get("start", 0.0)), float(w.get("end", 0.0)), wt))
                  if words:
                      for i in range(0, len(words), 3):
                          grp = words[i:i+3]
                          st = max(0.0, grp[0][0] - LEAD_SEC)
                          et = max(st + 0.22, grp[-1][1] - (LEAD_SEC * 0.5))
                          txt = " ".join(x[2] for x in grp).upper()
                          events.append((st, et, txt))
              except Exception:
                  pass

              if not events:
                  spoken_frames = [i for i, m in enumerate(mouth_states) if m > 0]
                  start_sec = max(0.0, (spoken_frames[0] / float(fps)) - 0.12) if spoken_frames else 0.0
                  end_sec = min(duration_sec, (spoken_frames[-1] / float(fps)) + 0.10) if spoken_frames else duration_sec * 0.90
                  active_dur = max(1.0, end_sec - start_sec)
                  all_words = script_text.strip().split()
                  chunks = [" ".join(all_words[i:i+3]).upper() for i in range(0, len(all_words), 3)]
                  weights = [max(3, len(c)) + (4 if any(p in c for p in (".", ",", "?", "!")) else 0) for c in chunks]
                  total_w = float(sum(weights)) or 1.0
                  cur_t = start_sec
                  for c, w in zip(chunks, weights):
                      dur = active_dur * (w / total_w)
                      st = max(0.0, cur_t - LEAD_SEC)
                      et = max(st + 0.20, cur_t + dur - (LEAD_SEC * 0.5))
                      events.append((st, et, c))
                      cur_t += dur

              header = """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Iman,DejaVu Sans,72,&H0040D7FF,&H00FFFFFF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,6,3,2,60,60,150,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """
              def fmt_t(sec):
                  h = int(sec // 3600)
                  m = int((sec % 3600) // 60)
                  s = sec % 60
                  return f"{h}:{m:02d}:{s:05.2f}"

              lines = [header]
              for st, et, txt in events:
                  lines.append(f"Dialogue: 0,{fmt_t(st)},{fmt_t(et)},Iman,,0,0,0,,{txt}")
              with open(ass_path, "w", encoding="utf-8") as f:
                  f.write("\n".join(lines))

          def build_native_9x16_stickman_video(mp4_path, script_text):
              print("  [9:16 Stickman World] Rendering native 1080x1920 vertical Stickman scenes...", flush=True)
              FPS = 15
              raw_pcm = subprocess.check_output([
                  "ffmpeg", "-v", "error", "-i", mp4_path,
                  "-ac", "1", "-ar", str(FPS * 200), "-f", "s16le", "-"
              ])
              samples = struct.unpack(f"<{len(raw_pcm)//2}h", raw_pcm)
              total_frames = max(1, len(samples) // 200)
              duration_sec = total_frames / float(FPS)

              mouth_states = []
              for f in range(total_frames):
                  chunk = samples[f*200:(f+1)*200]
                  avg_amp = sum(abs(x) for x in chunk) / max(1, len(chunk))
                  if avg_amp < 450:
                      mouth_states.append(0)
                  elif avg_amp < 1400:
                      mouth_states.append(1)
                  elif avg_amp < 2800:
                      mouth_states.append(2)
                  else:
                      mouth_states.append(3)

              sentences = [s.strip() for s in re.split(r'(?<=[.!?])\s+', script_text.strip()) if s.strip()]
              if not sentences:
                  sentences = [script_text.strip() or "Wall Street and central banks are buying physical gold."]

              scene_meta = []
              for idx, sent in enumerate(sentences):
                  stype = classify_sentence_scene(sent, idx)
                  words = [re.sub(r'[^a-zA-Z0-9$%]', '', w) for w in sent.split() if len(w) > 2]
                  headline = " ".join(words[:4]) if len(words) >= 4 else stype.replace("_", " ").upper()
                  ai_board = try_native_9x16_ai_board(sent, idx)
                  scene_meta.append((stype, headline, sent[:44], ai_board))

              ass_path = "/tmp/stickman_captions.ass"
              build_synced_ass_subtitles(mp4_path, script_text, duration_sec, mouth_states, FPS, ass_path)

              sent_weights = [max(10, len(s)) for s in sentences]
              total_sw = float(sum(sent_weights))
              scene_end_frames = []
              acc = 0.0
              for w in sent_weights:
                  acc += total_frames * (w / total_sw)
                  scene_end_frames.append(int(round(acc)))
              scene_end_frames[-1] = total_frames

              raw_mp4 = "/tmp/stickman_raw.mp4"
              proc = subprocess.Popen([
                  "ffmpeg", "-y", "-v", "error",
                  "-f", "rawvideo", "-pix_fmt", "rgb24", "-s", "1080x1920", "-r", str(FPS), "-i", "-",
                  "-i", mp4_path,
                  "-map", "0:v:0", "-map", "1:a:0",
                  "-c:v", "libx264", "-preset", "ultrafast", "-pix_fmt", "yuv420p",
                  "-c:a", "copy", "-shortest", raw_mp4
              ], stdin=subprocess.PIPE)

              frame_cache = {}
              s_idx = 0
              for f in range(total_frames):
                  while s_idx < len(scene_end_frames) - 1 and f >= scene_end_frames[s_idx]:
                      s_idx += 1
                  m_state = mouth_states[f]
                  key = (s_idx, m_state)
                  if key not in frame_cache:
                      stype, hl, sub, ai_b = scene_meta[s_idx]
                      frame_cache[key] = draw_stickman_world_frame(stype, hl, sub, m_state, s_idx, ai_b)
                  proc.stdin.write(frame_cache[key])
              proc.stdin.close()
              proc.wait()

              subprocess.run([
                  "ffmpeg", "-y", "-v", "error",
                  "-i", raw_mp4,
                  "-vf", f"ass={ass_path}",
                  "-c:v", "libx264", "-preset", "fast", "-pix_fmt", "yuv420p",
                  "-c:a", "copy", mp4_path
              ], check=True)
              print(f"  [9:16 Stickman World] Completed native vertical video: {mp4_path}", flush=True)

          sys.argv = ["verticals", "run", "--discover", "--auto-pick", "--niche", "finance", "--provider", "gemini", "--voice", "edge"]
          try:
              main()
          except Exception as e:
              print(f"  [Self-Healing Fallback] Primary pipeline encountered error ({e}), generating Short directly...", flush=True)

          mp4s = sorted(glob.glob(os.path.expanduser("~/.verticals/**/*.mp4"), recursive=True), key=os.path.getmtime)
          drafts = sorted(glob.glob(os.path.expanduser("~/.verticals/drafts/*.json")), key=os.path.getmtime)

          title = "Why Wall Street & Central Banks Buy Physical Gold #Shorts"
          desc = "Stickman finance explainer on Wall Street, central banks, inflation, and tangible money. #finance #money #shorts"
          tags = ["finance", "wallstreet", "gold", "investing", "shorts"]
          script_text = (
              "Right now on Wall Street, institutional traders are watching central banks buy physical gold at record speed. "
              "While the Federal Reserve prints trillions in paper currency, everyday savings quietly lose purchasing power to inflation. "
              "Most people have no idea why tangible assets outperform cash during market turmoil. "
              "Inside global bank vaults, physical gold bullion remains the ultimate money you can hold in your hand. "
              "Are you holding cash or real assets right now? Drop your thoughts in the comments."
          )

          if drafts:
              try:
                  with open(drafts[-1]) as f:
                      d = json.load(f)
                      title = d.get("title", title)[:95]
                      desc = d.get("description", d.get("script", desc))
                      tags = d.get("tags", tags)
                      script_text = d.get("script", script_text)
              except Exception:
                  pass

          if not mp4s:
              out_dir = os.path.expanduser("~/.verticals/output")
              os.makedirs(out_dir, exist_ok=True)
              fallback_mp3 = "/tmp/stickman_voice.mp3"
              subprocess.run([
                  sys.executable, "-m", "edge_tts",
                  "--voice", "en-US-AriaNeural",
                  "--text", script_text,
                  "--write-media", fallback_mp3
              ], check=True)
              fallback_mp4 = os.path.join(out_dir, "verticals_stickman_en.mp4")
              subprocess.run([
                  "ffmpeg", "-y", "-v", "error",
                  "-f", "lavfi", "-i", "color=c=black:s=1080x1920:r=15",
                  "-i", fallback_mp3,
                  "-c:v", "libx264", "-preset", "ultrafast", "-pix_fmt", "yuv420p",
                  "-c:a", "aac", "-shortest", fallback_mp4
              ], check=True)
              mp4s = [fallback_mp4]

          mp4_file = mp4s[-1]
          build_native_9x16_stickman_video(mp4_file, script_text)

          # Direct Guaranteed YouTube Upload (Public)
          yt_url = ""
          try:
              from google.oauth2.credentials import Credentials
              from google.auth.transport.requests import Request
              from googleapiclient.discovery import build
              from googleapiclient.http import MediaFileUpload

              tok_path = os.path.expanduser("~/.verticals/youtube_token.json")
              with open(tok_path) as f:
                  td = json.load(f)
              creds = Credentials(
                  token=td.get("token"),
                  refresh_token=td.get("refresh_token"),
                  token_uri=td.get("token_uri", "https://oauth2.googleapis.com/token"),
                  client_id=td.get("client_id"),
                  client_secret=td.get("client_secret"),
              )
              creds.refresh(Request())
              yt = build("youtube", "v3", credentials=creds)
              body = {
                  "snippet": {
                      "title": title,
                      "description": desc + "\n\n#Shorts #Finance #Money",
                      "tags": tags,
                      "categoryId": "27"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }
              media = MediaFileUpload(mp4_file, chunksize=-1, resumable=True, mimetype="video/mp4")
              req = yt.videos().insert(part="snippet,status", body=body, media_body=media)
              res = None
              while res is None:
                  status, res = req.next_chunk()
              vid_id = res.get("id")
              yt_url = f"https://youtube.com/shorts/{vid_id}"
              print(f"\n==========================================", flush=True)
              print(f"✅ YOUTUBE UPLOAD SUCCESSFUL: {yt_url}", flush=True)
              print(f"==========================================\n", flush=True)
          except Exception as e:
              print(f"\n⚠️ YouTube Direct Upload Error: {e}\n", flush=True)

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          run_url = f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}"
          if summary_file:
              with open(summary_file, "a") as sf:
                  sf.write("## 🎬 Native 9:16 Stickman Explainer Short Ready!\n\n")
                  sf.write(f"- **Title:** {title}\n")
                  if yt_url:
                      sf.write(f"- 🔴 **YouTube Short Link (Public):** [{yt_url}]({yt_url})\n")
                  else:
                      sf.write("- ⚠️ **YouTube Status:** Auto-upload skipped/failed — download the MP4 below.\n")
                  sf.write(f"- 📥 **Direct MP4 Video Backup (Artifacts):** [Click here and scroll down to `generated-short-video`]({run_url})\n")
          EOF
          python3 run_bot.py

      - name: Save MP4 Backup for TikTok and YouTube
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-short-video
          path: |
            ~/.verticals/**/*.mp4
            ~/.verticals/**/*.json
