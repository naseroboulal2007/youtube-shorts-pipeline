              draw.text((95, 116), headline_text[:30].upper(), fill=(255, 215, 64), font=f_title)

              # Upper 9:16 Stage Graphics
              if scene_type == "wall_street":
                  draw.rounded_rectangle([70, 240, 1010, 920], radius=28, fill=(18, 24, 38), outline="white", width=6)
                  draw.rounded_rectangle([105, 275, 465, 365], radius=14, fill=(22, 135, 75), outline="white", width=4)
                  draw.text((135, 298), "WALL ST • NYSE", fill="white", font=f_med)
                  draw.text((505, 298), "LIVE TRADING BOARD", fill=(170, 190, 220), font=f_med)
                  candles = [
                      (150, 720, 620, 760, 590, False),
                      (260, 680, 560, 710, 530, True),
                      (370, 610, 670, 700, 580, False),
                      (480, 650, 510, 680, 480, True),
                      (590, 540, 430, 570, 400, True),
                      (700, 480, 530, 560, 450, False),
                      (810, 510, 390, 540, 350, True),
                      (910, 420, 310, 450, 280, True),
                  ]
                  for cx, c_open, c_close, c_low, c_high, is_bull in candles:
                      col = (65, 235, 135) if is_bull else (255, 85, 85)
                      draw.line([(cx, c_high), (cx, c_low)], fill=col, width=5)
                      top_y, bot_y = min(c_open, c_close), max(c_open, c_close)
                      draw.rectangle([cx-28, top_y, cx+28, bot_y], fill=col, outline="white", width=2)
                  draw.rectangle([76, 820, 1004, 914], fill=(10, 14, 22))
                  draw.text((105, 850), "VOL HIGH  ▲   MARKET EXPANSION   ▲   ASSET ROTATION", fill=(65, 235, 135), font=f_sm)

              elif scene_type in ("property_empire", "tax_loophole"):
                  draw.rounded_rectangle([70, 240, 1010, 920], radius=28, fill=(18, 24, 38), outline=(255, 215, 64), width=6)
                  draw.text((115, 280), "ASSET CASH FLOW MATRIX", fill=(255, 215, 64), font=f_med)
                  bars = [(130, 180, (90, 170, 255), "STOCK LOANS"), (420, 290, (72, 235, 145), "REAL ESTATE"), (710, 390, (255, 205, 56), "ASSET WEALTH")]
                  for bx, bh, col, lbl in bars:
                      draw.rounded_rectangle([bx, 820-bh, bx+200, 820], radius=14, fill=col, outline="white", width=4)
                      draw.text((bx+20, 835), lbl, fill="white", font=f_sm)

              elif scene_type == "pricing_trick":
                  draw.rounded_rectangle([70, 240, 1010, 920], radius=28, fill=(18, 24, 38), outline="white", width=6)
                  draw.text((115, 280), "THE DECOY PRICING ARCHITECTURE", fill="white", font=f_med)
                  draw.rounded_rectangle([110, 420, 340, 780], radius=16, fill=(35, 45, 68), outline="white", width=3)
                  draw.text((160, 460), "SMALL", fill=(180, 200, 230), font=f_med)
                  draw.text((170, 680), "$4.00", fill="white", font=f_title)

                  draw.rounded_rectangle([390, 360, 670, 780], radius=16, fill=(45, 55, 80), outline=(255, 85, 85), width=4)
                  draw.text((440, 400), "MEDIUM (DECOY)", fill=(255, 85, 85), font=f_sm)
                  draw.text((490, 680), "$7.00", fill="white", font=f_title)

                  draw.rounded_rectangle([720, 300, 970, 780], radius=16, fill=(28, 65, 45), outline=(72, 235, 145), width=6)
                  draw.text((790, 340), "LARGE", fill=(72, 235, 145), font=f_med)
