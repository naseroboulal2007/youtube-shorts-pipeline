              elif scene_type == "fed_printer":
                  draw.rounded_rectangle([70, 240, 1010, 920], radius=28, fill=(18, 24, 38), outline="white", width=6)
                  bx, by = 180, 275
                  draw.polygon([(bx, by+120), (540, by), (900, by+120)], fill=(45, 58, 82), outline="white", width=5)
                  draw.text((350, by+62), "FEDERAL RESERVE", fill="white", font=f_med)
                  for col in range(6):
                      px = bx + 45 + col * 115
                      draw.rectangle([px, by+120, px+55, by+410], fill=(35, 46, 68), outline="white", width=4)
                  draw.rectangle([bx-25, by+410, 925, by+455], fill=(55, 70, 98), outline="white", width=5)
                  bills = [(115, 765), (430, 780), (735, 760)]
                  for idx, (dx, dy) in enumerate(bills):
                      shift = ((anim_step + idx) % 3) * 8 - 8
                      draw.rounded_rectangle([dx, dy+shift, dx+215, dy+100+shift], radius=12, fill=(42, 155, 85), outline="white", width=4)
                      draw.text((dx+55, dy+28+shift), "$100", fill="white", font=f_med)

              elif scene_type in ("bank_vault", "cartel_monopoly"):
                  draw.rounded_rectangle([70, 240, 1010, 920], radius=28, fill=(22, 28, 44), outline=(255, 205, 56), width=6)
                  vx, vy, vr = 300, 575, 175
                  draw.ellipse([vx-vr, vy-vr, vx+vr, vy+vr], fill=(60, 72, 96), outline="white", width=8)
                  draw.ellipse([vx-vr+35, vy-vr+35, vx+vr-35, vy+vr-35], fill=(40, 50, 70), outline=(255, 205, 56), width=5)
                  for angle in range(0, 360, 45):
                      rad = math.radians(angle)
                      draw.line([(vx, vy), (vx+int(math.cos(rad)*105), vy+int(math.sin(rad)*105))], fill="white", width=7)
                  gx, gy = 535, 775
                  for row in range(3):
                      for col in range(3 - row):
                          bx = gx + col * 138 + row * 68
                          by = gy - row * 82
                          draw.polygon([(bx, by), (bx+22, by-65), (bx+116, by-65), (bx+138, by)], fill=(255, 202, 35), outline="white", width=4)
                  draw.text((535, 315), "VAULT DEPOSITS & ASSETS", fill=(255, 215, 64), font=f_med)
                  draw.text((535, 375), "Fractional Reserves", fill="white", font=f_sm)

              else:
                  draw.rounded_rectangle([70, 240, 1010, 920], radius=28, fill=(18, 24, 38), outline=(255, 85, 85), width=6)
                  draw.text((115, 285), "PURCHASING POWER EROSION", fill=(255, 105, 105), font=f_med)
                  pts = [(135, 390), (330, 470), (520, 515), (720, 685), (925, 825)]
                  draw.line(pts, fill=(255, 85, 85), width=14)
                  for px, py in pts:
                      draw.ellipse([px-12, py-12, px+12, py+12], fill=(255, 85, 85), outline="white", width=3)
                  draw.rounded_rectangle([135, 660, 415, 800], radius=14, fill=(42, 155, 85), outline="white", width=4)
                  draw.text((195, 708), "-20% LESS", fill="white", font=f_med)

              # Full-Size Expressive Speaking Stickman in Center-Bottom Stage (y = 980 .. 1560)
              draw.line([(0, 1555), (W, 1555)], fill=(65, 80, 110), width=6)
              sx, sy = 540, 1085
              head_r = 94
              draw.ellipse([sx-head_r, sy-head_r, sx+head_r, sy+head_r], fill=(18, 22, 34), outline="white", width=12)
              draw.ellipse([sx-42, sy-32, sx-16, sy-2], fill="white")
              draw.ellipse([sx+16, sy-32, sx+42, sy-2], fill="white")
              draw.line([(sx-52, sy-48), (sx-12, sy-38)], fill="white", width=7)
              draw.line([(sx+12, sy-38), (sx+52, sy-48)], fill="white", width=7)

              if mouth_state == 0:
                  draw.arc([sx-30, sy+18, sx+30, sy+44], start=10, end=170, fill="white", width=7)
              elif mouth_state == 1:
                  draw.rounded_rectangle([sx-26, sy+22, sx+26, sy+46], radius=10, fill=(240, 85, 85), outline="white", width=5)
              elif mouth_state == 2:
                  draw.rounded_rectangle([sx-34, sy+16, sx+34, sy+58], radius=14, fill=(240, 85, 85), outline="white", width=5)
              else:
                  draw.ellipse([sx-26, sy+16, sx+26, sy+62], fill=(240, 85, 85), outline="white", width=5)

              neck_y = sy + head_r
              shoulder_y = neck_y + 40
              hip_y = neck_y + 235
              draw.line([(sx, neck_y), (sx, hip_y)], fill="white", width=14)

              l_hand_y = shoulder_y - 145 if anim_step % 2 == 0 else shoulder_y - 110
              draw.line([(sx, shoulder_y), (sx-130, shoulder_y-30), (sx-210, l_hand_y)], fill="white", width=12)
              draw.ellipse([sx-226, l_hand_y-16, sx-194, l_hand_y+16], fill=(255, 215, 64), outline="white", width=4)

              r_hand_y = shoulder_y - 10 if mouth_state < 2 else shoulder_y - 45
              draw.line([(sx, shoulder_y), (sx+120, shoulder_y+55), (sx+185, r_hand_y)], fill="white", width=12)
              draw.ellipse([sx+171, r_hand_y-14, sx+199, r_hand_y+14], fill="white")

              draw.line([(sx, hip_y), (sx-80, 1555)], fill="white", width=14)
              draw.line([(sx, hip_y), (sx+80, 1555)], fill="white", width=14)
              return img.tobytes()

          def build_synced_ass_subtitles(mp4_path, script_text, duration_sec, mouth_states, fps, ass_path):
              LEAD_SEC = 0.22
              events = []
              try:
                  import whisper
                  model = whisper.load_model("base")
                  res = model.transcribe(mp4_path, word_timestamps=True)
                  words = []
                  for seg in res.get("segments", []):
                      for w in seg.get("words", []):
                          wt = str(w.get("word", "")).strip()
                          if wt:
                              words.append((float(w.get("start", 0.0)), float(w.get("end", 0.0)), wt))
                  if words:
                      for i in range(0, len(words), 3):
                          grp = words[i:i+3]
                          st = max(0.0, grp[0][0] - LEAD_SEC)
                          et = max(st + 0.22, grp[-1][1] - (LEAD_SEC * 0.5))
                          txt = " ".join(x[2] for x in grp).upper()
                          events.append((st, et, txt))
              except Exception:
                  pass

              if not events:
                  spoken_frames = [i for i, m in enumerate(mouth_states) if m > 0]
                  start_sec = max(0.0, (spoken_frames[0] / float(fps)) - 0.12) if spoken_frames else 0.0
                  end_sec = min(duration_sec, (spoken_frames[-1] / float(fps)) + 0.10) if spoken_frames else duration_sec * 0.90
                  active_dur = max(1.0, end_sec - start_sec)
                  all_words = script_text.strip().split()
                  chunks = [" ".join(all_words[i:i+3]).upper() for i in range(0, len(all_words), 3)]
                  weights = [max(3, len(c)) + (4 if any(p in c for p in (".", ",", "?", "!")) else 0) for c in chunks]
                  total_w = float(sum(weights)) or 1.0
                  cur_t = start_sec
                  for c, w in zip(chunks, weights):
                      dur = active_dur * (w / total_w)
                      st = max(0.0, cur_t - LEAD_SEC)
                      et = max(st + 0.20, cur_t + dur - (LEAD_SEC * 0.5))
                      events.append((st, et, c))
                      cur_t += dur

              header = """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Iman,DejaVu Sans,72,&H0040D7FF,&H00FFFFFF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,6,3,2,60,60,150,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """
              def fmt_t(sec):
                  h = int(sec // 3600)
                  m = int((sec % 3600) // 60)
                  s = sec % 60
                  return f"{h}:{m:02d}:{s:05.2f}"

              lines = [header]
              for st, et, txt in events:
                  lines.append(f"Dialogue: 0,{fmt_t(st)},{fmt_t(et)},Iman,,0,0,0,,{txt}")
              with open(ass_path, "w", encoding="utf-8") as f:
                  f.write("\n".join(lines))

          def build_native_9x16_stickman_video(mp4_path, script_text, scene_type, headline):
              print(f"  [9:16 Stickman World] Rendering native 1080x1920 vertical Stickman scenes for: {headline}...", flush=True)
              FPS = 15
              raw_pcm = subprocess.check_output([
                  "ffmpeg", "-v", "error", "-i", mp4_path,
                  "-ac", "1", "-ar", str(FPS * 200), "-f", "s16le", "-"
              ])
              samples = struct.unpack(f"<{len(raw_pcm)//2}h", raw_pcm)
              total_frames = max(1, len(samples) // 200)
              duration_sec = total_frames / float(FPS)

              mouth_states = []
              for f in range(total_frames):
                  chunk = samples[f*200:(f+1)*200]
                  avg_amp = sum(abs(x) for x in chunk) / max(1, len(chunk))
                  if avg_amp < 450:
                      mouth_states.append(0)
                  elif avg_amp < 1400:
                      mouth_states.append(1)
                  elif avg_amp < 2800:
                      mouth_states.append(2)
                  else:
                      mouth_states.append(3)

              ass_path = "/tmp/stickman_captions.ass"
              build_synced_ass_subtitles(mp4_path, script_text, duration_sec, mouth_states, FPS, ass_path)

              raw_mp4 = "/tmp/stickman_raw.mp4"
              proc = subprocess.Popen([
                  "ffmpeg", "-y", "-v", "error",
                  "-f", "rawvideo", "-pix_fmt", "rgb24", "-s", "1080x1920", "-r", str(FPS), "-i", "-",
                  "-i", mp4_path,
                  "-map", "0:v:0", "-map", "1:a:0",
                  "-c:v", "libx264", "-preset", "ultrafast", "-pix_fmt", "yuv420p",
                  "-c:a", "copy", "-shortest", raw_mp4
              ], stdin=subprocess.PIPE)

              frame_cache = {}
              for f in range(total_frames):
                  m_state = mouth_states[f]
                  anim_step = (f // 45) % 4
                  key = (anim_step, m_state)
                  if key not in frame_cache:
                      frame_cache[key] = draw_stickman_world_frame(scene_type, headline, script_text[:40], m_state, anim_step)
                  proc.stdin.write(frame_cache[key])
              proc.stdin.close()
              proc.wait()

              subprocess.run([
                  "ffmpeg", "-y", "-v", "error",
                  "-i", raw_mp4,
                  "-vf", f"ass={ass_path}",
                  "-c:v", "libx264", "-preset", "fast", "-pix_fmt", "yuv420p",
                  "-c:a", "copy", mp4_path
              ], check=True)
              print(f"  [9:16 Stickman World] Completed native vertical video: {mp4_path}", flush=True)

          sys.argv = ["verticals", "run", "--discover", "--auto-pick", "--niche", "finance", "--provider", "gemini", "--voice", "edge"]
          try:
              main()
          except Exception as e:
              print(f"  [Notice] Primary run returned ({e}), generating Short with today's rotating topic...", flush=True)

          mp4s = sorted(glob.glob(os.path.expanduser("~/.verticals/**/*.mp4"), recursive=True), key=os.path.getmtime)
          drafts = sorted(glob.glob(os.path.expanduser("~/.verticals/drafts/*.json")), key=os.path.getmtime)

          title = active_topic["title"]
          desc = active_topic["desc"]
          tags = active_topic["tags"]
          script_text = active_topic["script"]
          scene_type = active_topic["scene_type"]
          headline = active_topic["headline"]

          if drafts:
              try:
                  with open(drafts[-1]) as f:
                      d = json.load(f)
                      # Only take draft if it matches today's topic or has substance
                      if d.get("script") and len(d.get("script", "")) > 100:
                          script_text = d.get("script")
                          title = d.get("title", title)[:95] + " #Shorts"
                          desc = d.get("description", desc)
              except Exception:
                  pass

          if not mp4s:
              out_dir = os.path.expanduser("~/.verticals/output")
              os.makedirs(out_dir, exist_ok=True)
              fallback_mp3 = "/tmp/stickman_voice.mp3"
              subprocess.run([
                  sys.executable, "-m", "edge_tts",
                  "--voice", "en-US-AriaNeural",
                  "--text", script_text,
                  "--write-media", fallback_mp3
              ], check=True)
              fallback_mp4 = os.path.join(out_dir, "verticals_stickman_en.mp4")
              subprocess.run([
                  "ffmpeg", "-y", "-v", "error",
                  "-f", "lavfi", "-i", "color=c=black:s=1080x1920:r=15",
                  "-i", fallback_mp3,
                  "-c:v", "libx264", "-preset", "ultrafast", "-pix_fmt", "yuv420p",
                  "-c:a", "aac", "-shortest", fallback_mp4
              ], check=True)
              mp4s = [fallback_mp4]

          mp4_file = mp4s[-1]
          build_native_9x16_stickman_video(mp4_file, script_text, scene_type, headline)

          # Direct Guaranteed YouTube Upload (Public)
          yt_url = ""
          try:
              from google.oauth2.credentials import Credentials
              from google.auth.transport.requests import Request
              from googleapiclient.discovery import build
              from googleapiclient.http import MediaFileUpload

              tok_path = os.path.expanduser("~/.verticals/youtube_token.json")
              with open(tok_path) as f:
                  td = json.load(f)
              creds = Credentials(
                  token=td.get("token"),
                  refresh_token=td.get("refresh_token"),
                  token_uri=td.get("token_uri", "https://oauth2.googleapis.com/token"),
                  client_id=td.get("client_id"),
                  client_secret=td.get("client_secret"),
              )
              creds.refresh(Request())
              yt = build("youtube", "v3", credentials=creds)
              body = {
                  "snippet": {
                      "title": title,
                      "description": desc + "\n\n#Shorts #Finance #Economics",
                      "tags": tags,
                      "categoryId": "27"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }
              media = MediaFileUpload(mp4_file, chunksize=-1, resumable=True, mimetype="video/mp4")
              req = yt.videos().insert(part="snippet,status", body=body, media_body=media)
              res = None
              while res is None:
                  status, res = req.next_chunk()
              vid_id = res.get("id")
              yt_url = f"https://youtube.com/shorts/{vid_id}"
              print(f"\n==========================================", flush=True)
              print(f"✅ YOUTUBE UPLOAD SUCCESSFUL: {yt_url}", flush=True)
              print(f"==========================================\n", flush=True)
          except Exception as e:
              print(f"\n⚠️ YouTube Direct Upload Error: {e}\n", flush=True)

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          run_url = f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}"
          if summary_file:
              with open(summary_file, "a") as sf:
                  sf.write("## 🎬 Native 9:16 Stickman Explainer Short Ready!\n\n")
                  sf.write(f"- **Today's Topic:** {title}\n")
                  if yt_url:
                      sf.write(f"- 🔴 **YouTube Short Link (Public):** [{yt_url}]({yt_url})\n")
                  else:
                      sf.write("- ⚠️ **YouTube Status:** Auto-upload skipped/failed — download the MP4 below.\n")
                  sf.write(f"- 📥 **Direct MP4 Video Backup (Artifacts):** [Click here and scroll down to `generated-short-video`]({run_url})\n")
          EOF
          python3 run_bot.py

      - name: Save MP4 Backup for TikTok and YouTube
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-short-video
          path: |
            ~/.verticals/**/*.mp4
            ~/.verticals/**/*.json
