name: Auto Shorts

on:
  schedule:
    - cron: "0 21 * * 0,1,2,3,5"
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -rRequirements.txt || pip install -r requirements.txt
          pip install pillow requests edge-tts google-api-python-client google-auth google-auth-oauthlib

      - name: Configure YouTube OAuth Token
        env:
          YT_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python3 -c '
          import os, re, json, base64
          raw = os.environ.get("YT_TOKEN", "")
          m = re.search(r"\{.*\}", raw, re.DOTALL)
          fb = ""
          token_str = m.group(0) if m else base64.b64decode(fb)[::-1].decode("utf-8")
          try:
              json.loads(token_str)
          except Exception:
              token_str = base64.b64decode(fb)[::-1].decode("utf-8")
          p = os.path.expanduser("~/.verticals")
          os.makedirs(p, exist_ok=True)
          with open(os.path.join(p, "youtube_token.json"), "w") as f:
              f.write(token_str)
          print("YouTube OAuth token configured successfully!")
          '

      - name: Generate Stickman Explainer Short and Upload to YouTube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat << 'EOF' > run_bot.py
          import os, sys, io, glob, json, re, math, time, base64, struct, subprocess, urllib.parse
          import requests
          from PIL import Image, ImageDraw, ImageFont
          import verticals.llm as llm
          import verticals.topics.engine as eng
          from verticals.__main__ import main

          # 1. Overwrite finance niche profile for Stick & Meme Explainer ("Money you can hold")
          os.makedirs("niches", exist_ok=True)
          with open("niches/finance.yaml", "w", encoding="utf-8") as f:
              f.write("""name: finance
          display_name: "Stick & Meme Explainer - Money You Can Hold"
          description: "Viral 30-second Stickman & Meme Explainer Shorts about tangible money, physical gold, inflation, central banks, and real assets."
          tone: "punchy, witty, conversational stickman explainer, zero jargon, fast-paced"
          visual_style: "2D minimalist white stickman character on a dark studio background speaking while big pop-up icons of gold bars, dollar bills, and charts pop up around him"
          target_duration: 32
          """)

          orig_post = requests.post
          api_key = os.environ.get("GEMINI_API_KEY", "")

          TEXT_MODELS = []
          IMAGE_MODELS = [
              "models/gemini-3.1-flash-lite-image",
              "models/gemini-3.1-flash-image",
              "models/gemini-3.1-flash-image-preview",
              "models/gemini-nano-banana-2.1",
              "models/gemini-2.5-flash-image",
          ]
          try:
              r = requests.get(f"https://generativelanguage.googleapis.com/v1beta/models?key={api_key}", timeout=10)
              if r.status_code == 200:
                  for m in r.json().get("models", []):
                      name = m.get("name", "")
                      methods = m.get("supportedGenerationMethods", [])
                      if "generateContent" in methods:
                          if any(x in name for x in ("image", "banana", "imagen")):
                              if name not in IMAGE_MODELS:
                                  IMAGE_MODELS.append(name)
                          elif "gemini" in name and not any(x in name for x in ("tts", "audio", "embedding", "vision", "robotics", "computer-use")):
                              TEXT_MODELS.append(name)
          except Exception:
              pass

          PREFERRED_TEXT = [
              "models/gemini-2.5-flash",
              "models/gemini-2.5-flash-lite",
              "models/gemini-3-flash-preview",
              "models/gemini-3.1-flash-lite-preview",
              "models/gemini-2.0-flash",
          ]
          ORDERED_TEXT = [m for m in PREFERRED_TEXT if m in TEXT_MODELS] + [m for m in TEXT_MODELS if m not in PREFERRED_TEXT]
          if not ORDERED_TEXT:
              ORDERED_TEXT = PREFERRED_TEXT

          AI_SCENE_CARDS = []

          def fetch_ai_stickman_card(prompt_text):
              clean = re.sub(r'[^a-zA-Z0-9 ,.-]', '', str(prompt_text))[:140]
              stick_prompt = (
                  f"2D minimalist white stickman character on a dark navy studio background, "
                  f"expressive stick figure speaking and pointing at big glowing pop-up icons of {clean}, "
                  f"gold bars, dollar bills, comic explainer style, bold clean lines, no text"
              )
              # Tier 1: Google Flow / Nano Banana AI Image Models
              for im_model in IMAGE_MODELS:
                  try:
                      u = f"https://generativelanguage.googleapis.com/v1beta/{im_model}:generateContent?key={api_key}"
                      body = {
                          "contents": [{"parts": [{"text": stick_prompt}]}],
                          "generationConfig": {"responseModalities": ["TEXT", "IMAGE"]}
                      }
                      resp = orig_post(u, json=body, timeout=25)
                      if resp.status_code == 200:
                          parts = resp.json().get("candidates", [{}])[0].get("content", {}).get("parts", [])
                          for p in parts:
                              if "inlineData" in p and p["inlineData"].get("data"):
                                  raw = base64.b64decode(p["inlineData"]["data"])
                                  im = Image.open(io.BytesIO(raw)).convert("RGB")
                                  AI_SCENE_CARDS.append(im)
                                  print(f"  [Google Nano Banana AI] Generated Stickman scene via {im_model}", flush=True)
                                  return resp
                  except Exception:
                      pass
              # Tier 2: Pollinations Flux Stickman AI
              try:
                  q = urllib.parse.quote(stick_prompt)
                  p_url = f"https://image.pollinations.ai/prompt/{q}?width=840&height=420&nologo=true&model=flux&seed={int(time.time()*10)%10000}"
                  pr = requests.get(p_url, timeout=20)
                  if pr.status_code == 200 and len(pr.content) > 1000:
                      im = Image.open(io.BytesIO(pr.content)).convert("RGB")
                      AI_SCENE_CARDS.append(im)
                      b64_img = base64.b64encode(pr.content).decode("utf-8")
                      fake = requests.Response()
                      fake.status_code = 200
                      fake._content = json.dumps({
                          "candidates": [{"content": {"parts": [{"inlineData": {"mimeType": "image/png", "data": b64_img}}]}}]
                      }).encode("utf-8")
                      print("  [Flux Stickman AI] Generated Stickman scene card", flush=True)
                      return fake
              except Exception:
                  pass
              # Tier 3: Instant local Stickman frame so broll.py never fails
              im = Image.new("RGB", (1080, 1920), (12, 15, 22))
              buf = io.BytesIO()
              im.save(buf, format="PNG")
              b64_img = base64.b64encode(buf.getvalue()).decode("utf-8")
              fake = requests.Response()
              fake.status_code = 200
              fake._content = json.dumps({
                  "candidates": [{"content": {"parts": [{"inlineData": {"mimeType": "image/png", "data": b64_img}}]}}]
              }).encode("utf-8")
              return fake

          def smart_post(url, *args, **kwargs):
              if "generativelanguage.googleapis.com" in url and ":generateContent" in url:
                  payload = kwargs.get("json") or {}
                  gen_cfg = payload.get("generationConfig") or {}
                  modalities = gen_cfg.get("responseModalities") or []
                  is_img_req = ("IMAGE" in modalities) or ("image" in url) or ("imagen" in url) or ("banana" in url)
                  if is_img_req:
                      prompt_txt = "gold bars, paper money, and inflation chart"
                      try:
                          prompt_txt = payload["contents"][0]["parts"][0].get("text", prompt_txt)
                      except Exception:
                          pass
                      return fetch_ai_stickman_card(prompt_txt)
                  for m in ORDERED_TEXT:
                      new_url = re.sub(r'models/[^:]+:generateContent', f'{m}:generateContent', url)
                      resp = orig_post(new_url, *args, **kwargs)
                      if resp.status_code == 200:
                          return resp
                      time.sleep(1)
              return orig_post(url, *args, **kwargs)

          requests.post = smart_post

          def patched_auto_pick(self, candidates):
              if not candidates:
                  return "Why Central Banks Buy Physical Gold While Printing Paper Money"
              top = candidates[:8]
              items = "\n".join(f"{i+1}. {c.title}" for i, c in enumerate(top))
              try:
                  res = llm.call_llm(
                      prompt=f"Pick the best finance topic for a 30s Stickman Explainer Short. Reply ONLY with the number (1-{len(top)}):\n{items}",
                      system="Reply with a single integer only.",
                      provider="gemini",
                      max_tokens=16,
                      temperature=0.2,
                  )
                  m = re.search(r"\d+", str(res))
                  idx = int(m.group()) - 1 if m else 0
                  if 0 <= idx < len(top):
                      return top[idx].title
              except Exception:
                  pass
              return top[0].title

          eng.TopicEngine.auto_pick = patched_auto_pick

          def draw_vector_illustration(draw, cx, cy, cw, ch, scene_idx):
              kind = scene_idx % 6
              if kind == 0:
                  gx, gy = cx + 60, cy + 370
                  for row in range(2):
                      for col in range(2 - row):
                          bx = gx + col * 170 + row * 85
                          by = gy - row * 70
                          draw.polygon([(bx, by), (bx+26, by-60), (bx+142, by-60), (bx+168, by)], fill=(255, 202, 40), outline="white", width=4)
                          draw.line([(bx+40, by-40), (bx+125, by-40)], fill=(255, 242, 160), width=4)
                  pts = [(cx+460, cy+390), (cx+540, cy+340), (cx+620, cy+360), (cx+710, cy+250), (cx+800, cy+175)]
                  draw.line(pts, fill=(72, 235, 145), width=12)
                  for px, py in pts:
                      draw.ellipse([px-9, py-9, px+9, py+9], fill=(72, 235, 145), outline="white", width=3)
              elif kind == 1:
                  dx, dy = cx + 70, cy + 180
                  draw.rounded_rectangle([dx, dy, dx+280, dy+150], radius=14, fill=(45, 145, 85), outline="white", width=4)
                  draw.ellipse([dx+105, dy+35, dx+175, dy+115], fill=(35, 115, 65), outline="white", width=3)
                  pts = [(cx+430, cy+180), (cx+520, cy+230), (cx+610, cy+215), (cx+710, cy+320), (cx+805, cy+395)]
                  draw.line(pts, fill=(255, 85, 85), width=12)
                  for px, py in pts:
                      draw.ellipse([px-9, py-9, px+9, py+9], fill=(255, 85, 85), outline="white", width=3)
              elif kind == 2:
                  bx, by = cx + 90, cy + 165
                  draw.polygon([(bx, by+70), (bx+140, by), (bx+280, by+70)], fill=(180, 195, 220), outline="white", width=4)
                  for col in range(4):
                      px = bx + 25 + col * 68
                      draw.rectangle([px, by+70, px+32, by+210], fill=(150, 165, 190), outline="white", width=3)
                  draw.rectangle([bx-10, by+210, bx+290, by+235], fill=(180, 195, 220), outline="white", width=4)
                  for i in range(3):
                      fx, fy = cx + 470 + i*95, cy + 190 + (i%2)*65
                      draw.rounded_rectangle([fx, fy, fx+130, fy+70], radius=8, fill=(65, 185, 105), outline="white", width=3)
              elif kind == 3:
                  mx, my = cx + 440, cy + 170
                  draw.line([(mx, my), (mx, my+230)], fill="white", width=8)
                  draw.rectangle([mx-90, my+230, mx+90, my+250], fill=(200, 210, 230), outline="white", width=3)
                  draw.line([(mx-240, my+95), (mx+240, my+25)], fill=(255, 205, 56), width=8)
                  draw.polygon([(mx-290, my+165), (mx-190, my+165), (mx-210, my+205), (mx-270, my+205)], fill=(255, 200, 40), outline="white", width=3)
                  draw.rectangle([mx+195, my+75, mx+285, my+120], fill=(65, 185, 105), outline="white", width=3)
              elif kind == 4:
                  bars = [
                      (cx+110, 90, (255, 85, 85)),
                      (cx+290, 160, (95, 165, 255)),
                      (cx+470, 230, (72, 235, 145)),
                      (cx+650, 275, (255, 205, 56)),
                  ]
                  base_y = cy + 415
                  for bx, bh, col in bars:
                      draw.rounded_rectangle([bx, base_y-bh, bx+110, base_y], radius=10, fill=col, outline="white", width=4)
              else:
                  sx, sy = cx + 220, cy + 165
                  draw.polygon([(sx, sy), (sx+130, sy+40), (sx+110, sy+180), (sx, sy+245), (sx-110, sy+180), (sx-130, sy+40)], fill=(45, 115, 225), outline=(255, 205, 56), width=6)
                  draw.line([(sx-45, sy+125), (sx-10, sy+165), (sx+55, sy+85)], fill=(72, 235, 145), width=12)
                  pts = [(cx+460, cy+380), (cx+580, cy+290), (cx+670, cy+320), (cx+790, cy+185)]
                  draw.line(pts, fill=(255, 205, 56), width=12)

          def render_stickman_frame_bytes(scene_idx, headline, subtext, badge_text, mouth_state, pop1_scale, pop2_scale, ai_img=None):
              W, H = 1080, 1920
              img = Image.new("RGB", (W, H), (12, 15, 22))
              draw = ImageDraw.Draw(img)
              for x in range(0, W, 60):
                  draw.line([(x, 0), (x, H)], fill=(22, 27, 38), width=1)
              for y in range(0, H, 60):
                  draw.line([(0, y), (W, y)], fill=(22, 27, 38), width=1)

              try:
                  f_title = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 44)
                  f_sub = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 32)
                  f_badge = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 36)
                  f_small = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 26)
              except Exception:
                  f_title = f_sub = f_badge = f_small = ImageFont.load_default()

              # Pop-Up Card 1 (Top Visual Stage)
              if pop1_scale > 0.05:
                  cw, ch = int(880 * pop1_scale), int(540 * pop1_scale)
                  cx, cy = 540 - cw // 2, 380 - ch // 2
                  draw.rounded_rectangle([cx+10, cy+12, cx+cw+10, cy+ch+12], radius=32, fill=(5, 7, 12))
                  draw.rounded_rectangle([cx, cy, cx+cw, cy+ch], radius=32, fill=(24, 31, 46), outline=(255, 205, 56), width=6)
                  if pop1_scale > 0.75:
                      draw.rounded_rectangle([cx+24, cy+24, cx+cw-24, cy+108], radius=18, fill=(36, 46, 68))
                      draw.text((cx+44, cy+42), headline[:28].upper(), fill=(255, 215, 64), font=f_title)
                      if ai_img is not None:
                          card_im = ai_img.resize((cw-48, ch-195))
                          img.paste(card_im, (cx+24, cy+120))
                      else:
                          draw_vector_illustration(draw, cx, cy, cw, ch, scene_idx)
                      draw.text((cx+44, cy+ch-64), subtext[:42], fill=(215, 225, 242), font=f_small)

              # Pop-Up Card 2 (Key Fact Callout popping beside Stickman!)
              if pop2_scale > 0.05:
                  bw, bh = int(500 * pop2_scale), int(225 * pop2_scale)
                  bx, by = 730 - bw // 2, 835 - bh // 2
                  draw.rounded_rectangle([bx+8, by+10, bx+bw+8, by+bh+10], radius=26, fill=(5, 7, 12))
                  draw.rounded_rectangle([bx, by, bx+bw, by+bh], radius=26, fill=(30, 39, 58), outline=(72, 235, 145), width=5)
                  if pop2_scale > 0.75:
                      draw.polygon([(bx, by+bh//2-18), (bx-34, by+bh//2+10), (bx, by+bh//2+28)], fill=(30, 39, 58), outline=(72, 235, 145))
                      draw.text((bx+32, by+34), "POP-UP FACT:", fill=(72, 235, 145), font=f_sub)
                      draw.text((bx+32, by+92), badge_text[:20].upper(), fill="white", font=f_badge)
                      draw.text((bx+32, by+154), "Money You Can Hold", fill=(170, 185, 210), font=f_small)

              # Animated Speaking Stickman
              sx, sy = 250, 960
              head_r = 92
              draw.ellipse([sx-head_r, sy-head_r, sx+head_r, sy+head_r], fill=(22, 27, 38), outline="white", width=12)
              draw.ellipse([sx-42, sy-32, sx-18, sy-2], fill="white")
              draw.ellipse([sx+18, sy-32, sx+42, sy-2], fill="white")
              if scene_idx % 2 == 0:
                  draw.line([(sx-50, sy-48), (sx-14, sy-40)], fill="white", width=6)
                  draw.line([(sx+14, sy-40), (sx+50, sy-48)], fill="white", width=6)
              else:
                  draw.line([(sx-50, sy-42), (sx-14, sy-50)], fill="white", width=6)
                  draw.line([(sx+14, sy-50), (sx+50, sy-42)], fill="white", width=6)

              if mouth_state == 0:
                  draw.arc([sx-30, sy+18, sx+30, sy+46], start=10, end=170, fill="white", width=7)
              elif mouth_state == 1:
                  draw.rounded_rectangle([sx-26, sy+24, sx+26, sy+48], radius=10, fill=(235, 85, 85), outline="white", width=5)
              elif mouth_state == 2:
                  draw.rounded_rectangle([sx-32, sy+18, sx+32, sy+60], radius=14, fill=(235, 85, 85), outline="white", width=5)
              else:
                  draw.ellipse([sx-24, sy+18, sx+24, sy+62], fill=(235, 85, 85), outline="white", width=5)

              if mouth_state > 0:
                  for r in (26, 48):
                      draw.arc([sx+head_r+6, sy-r, sx+head_r+6+int(r*1.1), sy+r], start=-38, end=38, fill=(255, 215, 64), width=5)

              neck_y = sy + head_r
              shoulder_y = neck_y + 45
              hip_y = neck_y + 310
              draw.line([(sx, neck_y), (sx, hip_y)], fill="white", width=14)

              l_elbow = (sx - 85, shoulder_y + 95)
              l_hand = (sx - 35, shoulder_y + 185) if scene_idx % 2 == 0 else (sx - 115, shoulder_y + 40)
              draw.line([(sx, shoulder_y), l_elbow, l_hand], fill="white", width=12)
              draw.ellipse([l_hand[0]-12, l_hand[1]-12, l_hand[0]+12, l_hand[1]+12], fill="white")

              r_elbow = (sx + 95, shoulder_y + 35)
              r_hand = (sx + 185, shoulder_y - 65) if pop2_scale < 0.5 else (sx + 195, shoulder_y - 125)
              draw.line([(sx, shoulder_y), r_elbow, r_hand], fill="white", width=12)
              draw.ellipse([r_hand[0]-14, r_hand[1]-14, r_hand[0]+14, r_hand[1]+14], fill=(255, 215, 64), outline="white", width=4)

              draw.line([(sx, hip_y), (sx - 75, hip_y + 230)], fill="white", width=14)
              draw.line([(sx, hip_y), (sx + 75, hip_y + 230)], fill="white", width=14)
              return img.tobytes()

          def build_stickman_explainer_video(mp4_path, script_text):
              print("  [Stickman Engine] Rebuilding background into Animated Speaking Stickman + Pop-Up Cards...", flush=True)
              FPS = 15
              raw_pcm = subprocess.check_output([
                  "ffmpeg", "-v", "error", "-i", mp4_path,
                  "-ac", "1", "-ar", str(FPS * 200), "-f", "s16le", "-"
              ])
              samples = struct.unpack(f"<{len(raw_pcm)//2}h", raw_pcm)
              total_frames = max(1, len(samples) // 200)
              duration_sec = total_frames / float(FPS)

              mouth_states = []
              for f in range(total_frames):
                  chunk = samples[f*200:(f+1)*200]
                  avg_amp = sum(abs(x) for x in chunk) / max(1, len(chunk))
                  if avg_amp < 450:
                      mouth_states.append(0)
                  elif avg_amp < 1400:
                      mouth_states.append(1)
                  elif avg_amp < 2800:
                      mouth_states.append(2)
                  else:
                      mouth_states.append(3)

              sentences = [s.strip() for s in re.split(r'(?<=[.!?])\s+', script_text.strip()) if s.strip()]
              if not sentences:
                  sentences = ["Real money is money you can hold in your hand.", "Gold and tangible assets protect purchasing power."]

              while len(AI_SCENE_CARDS) < min(4, len(sentences)):
                  fetch_ai_stickman_card(sentences[len(AI_SCENE_CARDS)])
                  if len(AI_SCENE_CARDS) == 0:
                      break

              all_words = script_text.strip().split()
              chunks = []
              for i in range(0, len(all_words), 4):
                  chunks.append(" ".join(all_words[i:i+4]).upper())
              ass_path = "/tmp/stickman_captions.ass"
              header = """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Iman,DejaVu Sans,70,&H0040D7FF,&H00FFFFFF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,6,3,2,60,60,140,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """
              def fmt_t(sec):
                  h = int(sec // 3600)
                  m = int((sec % 3600) // 60)
                  s = sec % 60
                  return f"{h}:{m:02d}:{s:05.2f}"

              lines = [header]
              step = duration_sec / max(1, len(chunks))
              for idx, ch_txt in enumerate(chunks):
                  lines.append(f"Dialogue: 0,{fmt_t(idx*step)},{fmt_t((idx+1)*step)},Iman,,0,0,0,,{ch_txt}")
              with open(ass_path, "w", encoding="utf-8") as f:
                  f.write("\n".join(lines))

              scenes = []
              frames_per_scene = max(15, total_frames // len(sentences))
              for idx, sent in enumerate(sentences):
                  words = [re.sub(r'[^a-zA-Z0-9$%]', '', w) for w in sent.split() if len(w) > 2]
                  headline = " ".join(words[:3]) if len(words) >= 3 else "MONEY YOU HOLD"
                  badge = " ".join(words[-3:]) if len(words) >= 3 else "REAL ASSETS"
                  subtext = sent[:42]
                  ai_im = AI_SCENE_CARDS[idx % len(AI_SCENE_CARDS)] if AI_SCENE_CARDS else None
                  scenes.append((idx, headline, subtext, badge, ai_im))

              raw_mp4 = "/tmp/stickman_raw.mp4"
              proc = subprocess.Popen([
                  "ffmpeg", "-y", "-v", "error",
                  "-f", "rawvideo", "-pix_fmt", "rgb24", "-s", "1080x1920", "-r", str(FPS), "-i", "-",
                  "-i", mp4_path,
                  "-map", "0:v:0", "-map", "1:a:0",
                  "-c:v", "libx264", "-preset", "ultrafast", "-pix_fmt", "yuv420p",
                  "-c:a", "copy", "-shortest", raw_mp4
              ], stdin=subprocess.PIPE)

              frame_cache = {}
              for f in range(total_frames):
                  s_idx = min(len(scenes) - 1, f // frames_per_scene)
                  local_f = f - (s_idx * frames_per_scene)
                  if local_f < 3:
                      stage = 0
                      p1, p2 = 0.65, 0.0
                  elif local_f < int(frames_per_scene * 0.42):
                      stage = 1
                      p1, p2 = 1.0, 0.0
                  elif local_f < int(frames_per_scene * 0.42) + 3:
                      stage = 2
                      p1, p2 = 1.0, 0.65
                  else:
                      stage = 3
                      p1, p2 = 1.0, 1.0
                  m_state = mouth_states[f] if stage in (1, 3) else 2
                  key = (s_idx, stage, m_state)
                  if key not in frame_cache:
                      idx, hl, sub, bdg, ai_im = scenes[s_idx]
                      frame_cache[key] = render_stickman_frame_bytes(idx, hl, sub, bdg, m_state, p1, p2, ai_im)
                  proc.stdin.write(frame_cache[key])
              proc.stdin.close()
              proc.wait()

              subprocess.run([
                  "ffmpeg", "-y", "-v", "error",
                  "-i", raw_mp4,
                  "-vf", f"ass={ass_path}",
                  "-c:v", "libx264", "-preset", "fast", "-pix_fmt", "yuv420p",
                  "-c:a", "copy", mp4_path
              ], check=True)
              print(f"  [Stickman Engine] Upgraded {mp4_path} to Stickman & Pop-Up Explainer style!", flush=True)

          sys.argv = ["verticals", "run", "--discover", "--auto-pick", "--niche", "finance", "--provider", "gemini", "--voice", "edge"]
          try:
              main()
          except Exception as e:
              print(f"  [Self-Healing Fallback] Primary pipeline encountered error ({e}), generating Stickman Short directly...", flush=True)

          mp4s = sorted(glob.glob(os.path.expanduser("~/.verticals/**/*.mp4"), recursive=True), key=os.path.getmtime)
          drafts = sorted(glob.glob(os.path.expanduser("~/.verticals/drafts/*.json")), key=os.path.getmtime)

          title = "Money You Can Hold: Why Gold Beats Paper #Shorts"
          desc = "Stickman finance explainer on tangible assets, inflation, and real money. #finance #money #shorts"
          tags = ["finance", "money", "gold", "investing", "shorts"]
          script_text = (
              "Central banks are buying physical gold at record speed while telling you paper cash is safe. "
              "Most people have no idea how fast inflation quietly drains their bank account every single year. "
              "Paper currency can be printed in trillions overnight, shrinking your purchasing power. "
              "Real money is money you can hold in your hand, like physical gold and productive tangible assets. "
              "When currencies drop, tangible assets protect your wealth. What is in your portfolio? Drop a comment below."
          )

          if drafts:
              try:
                  with open(drafts[-1]) as f:
                      d = json.load(f)
                      title = d.get("title", title)[:95]
                      desc = d.get("description", d.get("script", desc))
                      tags = d.get("tags", tags)
                      script_text = d.get("script", script_text)
              except Exception:
                  pass

          if not mp4s:
              out_dir = os.path.expanduser("~/.verticals/output")
              os.makedirs(out_dir, exist_ok=True)
              fallback_mp3 = "/tmp/stickman_voice.mp3"
              subprocess.run([
                  sys.executable, "-m", "edge_tts",
                  "--voice", "en-US-AriaNeural",
                  "--text", script_text,
                  "--write-media", fallback_mp3
              ], check=True)
              fallback_mp4 = os.path.join(out_dir, "verticals_stickman_en.mp4")
              subprocess.run([
                  "ffmpeg", "-y", "-v", "error",
                  "-f", "lavfi", "-i", "color=c=black:s=1080x1920:r=15",
                  "-i", fallback_mp3,
                  "-c:v", "libx264", "-preset", "ultrafast", "-pix_fmt", "yuv420p",
                  "-c:a", "aac", "-shortest", fallback_mp4
              ], check=True)
              mp4s = [fallback_mp4]

          mp4_file = mp4s[-1]
          build_stickman_explainer_video(mp4_file, script_text)

          # Direct Guaranteed YouTube Upload (Public)
          yt_url = ""
          try:
              from google.oauth2.credentials import Credentials
              from google.auth.transport.requests import Request
              from googleapiclient.discovery import build
              from googleapiclient.http import MediaFileUpload

              tok_path = os.path.expanduser("~/.verticals/youtube_token.json")
              with open(tok_path) as f:
                  td = json.load(f)
              creds = Credentials(
                  token=td.get("token"),
                  refresh_token=td.get("refresh_token"),
                  token_uri=td.get("token_uri", "https://oauth2.googleapis.com/token"),
                  client_id=td.get("client_id"),
                  client_secret=td.get("client_secret"),
              )
              creds.refresh(Request())
              yt = build("youtube", "v3", credentials=creds)
              body = {
                  "snippet": {
                      "title": title,
                      "description": desc + "\n\n#Shorts #Finance #Money",
                      "tags": tags,
                      "categoryId": "27"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }
              media = MediaFileUpload(mp4_file, chunksize=-1, resumable=True, mimetype="video/mp4")
              req = yt.videos().insert(part="snippet,status", body=body, media_body=media)
              res = None
              while res is None:
                  status, res = req.next_chunk()
              vid_id = res.get("id")
              yt_url = f"https://youtube.com/shorts/{vid_id}"
              print(f"\n==========================================", flush=True)
              print(f"✅ YOUTUBE UPLOAD SUCCESSFUL: {yt_url}", flush=True)
              print(f"==========================================\n", flush=True)
          except Exception as e:
              print(f"\n⚠️ YouTube Direct Upload Error: {e}\n", flush=True)

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          run_url = f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}"
          if summary_file:
              with open(summary_file, "a") as sf:
                  sf.write("## 🎬 Stickman & Pop-Up Explainer Short Ready!\n\n")
                  sf.write(f"- **Title:** {title}\n")
                  if yt_url:
                      sf.write(f"- 🔴 **YouTube Short Link (Public):** [{yt_url}]({yt_url})\n")
                  else:
                      sf.write("- ⚠️ **YouTube Status:** Auto-upload skipped/failed — download the MP4 below.\n")
                  sf.write(f"- 📥 **Direct MP4 Video Backup (Artifacts):** [Click here and scroll down to `generated-short-video`]({run_url})\n")
          EOF
          python3 run_bot.py

      - name: Save MP4 Backup for TikTok and YouTube
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-short-video
          path: |
            ~/.verticals/**/*.mp4
            ~/.verticals/**/*.json
