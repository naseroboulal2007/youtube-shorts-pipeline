name: Auto Shorts

on:
  schedule:
    - cron: "0 21 * * 0,1,2,3,5"
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -rRequirements.txt || pip install -r requirements.txt
          pip install pillow requests edge-tts duckduckgo-search google-api-python-client google-auth google-auth-oauthlib

      - name: Configure YouTube OAuth Token
        env:
          YT_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python3 -c '
          import os, re, json, base64
          raw = os.environ.get("YT_TOKEN", "")
          m = re.search(r"\{.*\}", raw, re.DOTALL)
          fb = ""
          token_str = m.group(0) if m else base64.b64decode(fb)[::-1].decode("utf-8")
          try:
              json.loads(token_str)
          except Exception:
              token_str = base64.b64decode(fb)[::-1].decode("utf-8")
          p = os.path.expanduser("~/.verticals")
          os.makedirs(p, exist_ok=True)
          with open(os.path.join(p, "youtube_token.json"), "w") as f:
              f.write(token_str)
          print("YouTube OAuth token configured successfully!")
          '

      - name: Generate Full-Screen Stickman Short and Upload to YouTube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat << 'EOF' > run_bot.py
          import os, sys, io, glob, json, re, math, time, base64, shutil, struct, subprocess, urllib.parse
          import requests
          from PIL import Image, ImageDraw, ImageFont
          import verticals.llm as llm
          import verticals.topics.engine as eng
          from verticals.__main__ import main

          # 1. Configure finance niche profile for concrete, script-faithful full-screen visuals
          os.makedirs("niches", exist_ok=True)
          with open("niches/finance.yaml", "w", encoding="utf-8") as f:
              f.write("""name: finance
          display_name: "Money You Can Hold - Visual Explainer"
          description: "Fast-paced 30-second finance Shorts explaining real-world money, Wall Street, central banks, physical gold, inflation, and tangible assets with concrete visual examples."
          tone: "direct, vivid, conversational explainer, concrete real-world examples, zero filler"
          visual_style: "Full-screen 9:16 vertical scenes showing exact real-world places (New York Stock Exchange trading floor on Wall Street, Federal Reserve building, gold bullion vaults) or detailed literal illustrations of each sentence in the script."
          target_duration: 32
          """)

          orig_post = requests.post
          api_key = os.environ.get("GEMINI_API_KEY", "")

          TEXT_MODELS = []
          IMAGE_MODELS = [
              "models/gemini-3.1-flash-lite-image",
              "models/gemini-3.1-flash-image",
              "models/gemini-3.1-flash-image-preview",
              "models/gemini-nano-banana-2.1",
              "models/gemini-2.5-flash-image",
          ]
          try:
              r = requests.get(f"https://generativelanguage.googleapis.com/v1beta/models?key={api_key}", timeout=10)
              if r.status_code == 200:
                  for m in r.json().get("models", []):
                      name = m.get("name", "")
                      methods = m.get("supportedGenerationMethods", [])
                      if "generateContent" in methods:
                          if any(x in name for x in ("image", "banana", "imagen")):
                              if name not in IMAGE_MODELS:
                                  IMAGE_MODELS.append(name)
                          elif "gemini" in name and not any(x in name for x in ("tts", "audio", "embedding", "vision", "robotics", "computer-use")):
                              TEXT_MODELS.append(name)
          except Exception:
              pass

          PREFERRED_TEXT = [
              "models/gemini-2.5-flash",
              "models/gemini-2.5-flash-lite",
              "models/gemini-3-flash-preview",
              "models/gemini-3.1-flash-lite-preview",
              "models/gemini-2.0-flash",
          ]
          ORDERED_TEXT = [m for m in PREFERRED_TEXT if m in TEXT_MODELS] + [m for m in TEXT_MODELS if m not in PREFERRED_TEXT]
          if not ORDERED_TEXT:
              ORDERED_TEXT = PREFERRED_TEXT

          USED_IMAGE_URLS = set()

          def make_placeholder_broll_response():
              im = Image.new("RGB", (1080, 1920), (14, 18, 26))
              buf = io.BytesIO()
              im.save(buf, format="PNG")
              b64_img = base64.b64encode(buf.getvalue()).decode("utf-8")
              fake = requests.Response()
              fake.status_code = 200
              fake._content = json.dumps({
                  "candidates": [{"content": {"parts": [{"inlineData": {"mimeType": "image/png", "data": b64_img}}]}}]
              }).encode("utf-8")
              return fake

          def smart_post(url, *args, **kwargs):
              if "generativelanguage.googleapis.com" in url and ":generateContent" in url:
                  payload = kwargs.get("json") or {}
                  gen_cfg = payload.get("generationConfig") or {}
                  modalities = gen_cfg.get("responseModalities") or []
                  is_img_req = ("IMAGE" in modalities) or ("image" in url) or ("imagen" in url) or ("banana" in url)
                  if is_img_req:
                      return make_placeholder_broll_response()
                  for m in ORDERED_TEXT:
                      new_url = re.sub(r'models/[^:]+:generateContent', f'{m}:generateContent', url)
                      resp = orig_post(new_url, *args, **kwargs)
                      if resp.status_code == 200:
                          return resp
                      time.sleep(1)
              return orig_post(url, *args, **kwargs)

          requests.post = smart_post

          def patched_auto_pick(self, candidates):
              if not candidates:
                  return "Why Wall Street and Central Banks Are Buying Physical Gold"
              top = candidates[:8]
              items = "\n".join(f"{i+1}. {c.title}" for i, c in enumerate(top))
              try:
                  res = llm.call_llm(
                      prompt=f"Pick the best finance topic for a 30s YouTube Short. Reply ONLY with the number (1-{len(top)}):\n{items}",
                      system="Reply with a single integer only.",
                      provider="gemini",
                      max_tokens=16,
                      temperature=0.2,
                  )
                  m = re.search(r"\d+", str(res))
                  idx = int(m.group()) - 1 if m else 0
                  if 0 <= idx < len(top):
                      return top[idx].title
              except Exception:
                  pass
              return top[0].title

          eng.TopicEngine.auto_pick = patched_auto_pick

          def download_valid_image(url):
              if not url or url in USED_IMAGE_URLS:
                  return None
              try:
                  headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36"}
                  r = requests.get(url, headers=headers, timeout=12)
                  if r.status_code == 200 and len(r.content) > 10000:
                      im = Image.open(io.BytesIO(r.content)).convert("RGB")
                      if im.width >= 450 and im.height >= 450:
                          USED_IMAGE_URLS.add(url)
                          return im
              except Exception:
                  pass
              return None

          def search_real_web_image(query):
              print(f"  [Web Search] Fetching real internet photo for: '{query}'", flush=True)
              # 1. DuckDuckGo Image Search
              for mod_name in ("ddgs", "duckduckgo_search"):
                  try:
                      mod = __import__(mod_name, fromlist=["DDGS"])
                      with mod.DDGS() as ddgs:
                          results = list(ddgs.images(query, max_results=12))
                          for item in results:
                              img_url = item.get("image") or item.get("url")
                              im = download_valid_image(img_url)
                              if im is not None:
                                  print(f"  [Web Search] Found real photo via DuckDuckGo: {img_url[:65]}", flush=True)
                                  return im
                  except Exception:
                      pass

              # 2. Bing Image Search
              try:
                  q = urllib.parse.quote(query + " photo")
                  b_url = f"https://www.bing.com/images/async?q={q}&first=0&count=15&qft=+filterui:imagesize-large"
                  headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36"}
                  r = requests.get(b_url, headers=headers, timeout=12)
                  if r.status_code == 200:
                      urls = re.findall(r'murl&quot;:&quot;(https?://[^&]+?)&quot;', r.text)
                      for u in urls[:12]:
                          im = download_valid_image(u)
                          if im is not None:
                              print(f"  [Web Search] Found real photo via Bing: {u[:65]}", flush=True)
                              return im
              except Exception:
                  pass

              # 3. Wikimedia Commons Photo Search
              try:
                  w_url = "https://commons.wikimedia.org/w/api.php"
                  params = {
                      "action": "query",
                      "generator": "search",
                      "gsrsearch": f"filetype:bitmap {query}",
                      "gsrlimit": 10,
                      "prop": "imageinfo",
                      "iiprop": "url|dimensions",
                      "format": "json"
                  }
                  r = requests.get(w_url, params=params, headers={"User-Agent": "ShortsVisualBot/1.0"}, timeout=10)
                  if r.status_code == 200:
                      pages = r.json().get("query", {}).get("pages", {})
                      for _, pdata in pages.items():
                          ii = (pdata.get("imageinfo") or [{}])[0]
                          u = ii.get("url")
                          im = download_valid_image(u)
                          if im is not None:
                              print(f"  [Web Search] Found real photo via Wikimedia: {u[:65]}", flush=True)
                              return im
              except Exception:
                  pass
              return None

          def generate_fullscreen_ai_scene(detailed_prompt, full_script_context, scene_idx):
              clean_scene = re.sub(r'[^a-zA-Z0-9 ,.$-%]', '', str(detailed_prompt))[:320]
              clean_ctx = re.sub(r'[^a-zA-Z0-9 ,.$-%]', '', str(full_script_context))[:220]
              full_prompt = (
                  f"Full-screen 9:16 vertical visual for a finance explainer video. "
                  f"Current spoken line: {clean_scene}. "
                  f"Overall story context: {clean_ctx}. "
                  f"Show the exact literal subjects, places, objects, and action described in the spoken line filling the entire vertical frame. "
                  f"Sharp, detailed, realistic visual storytelling, no random lamps or abstract lights, no text overlays, scene #{scene_idx+1}"
              )
              # 1. Google Flow / Nano Banana AI Image Models
              for im_model in IMAGE_MODELS:
                  try:
                      u = f"https://generativelanguage.googleapis.com/v1beta/{im_model}:generateContent?key={api_key}"
                      body = {
                          "contents": [{"parts": [{"text": full_prompt}]}],
                          "generationConfig": {"responseModalities": ["TEXT", "IMAGE"]}
                      }
                      resp = orig_post(u, json=body, timeout=25)
                      if resp.status_code == 200:
                          parts = resp.json().get("candidates", [{}])[0].get("content", {}).get("parts", [])
                          for p in parts:
                              if "inlineData" in p and p["inlineData"].get("data"):
                                  raw = base64.b64decode(p["inlineData"]["data"])
                                  im = Image.open(io.BytesIO(raw)).convert("RGB")
                                  print(f"  [Google Nano Banana AI] Generated full-screen scene #{scene_idx+1} via {im_model}", flush=True)
                                  return im
                  except Exception:
                      pass
              # 2. Pollinations Flux Full-Screen 9:16 AI with unique seed per sentence
              try:
                  q = urllib.parse.quote(full_prompt)
                  seed = (int(time.time()) + (scene_idx + 1) * 1337) % 999999
                  p_url = f"https://image.pollinations.ai/prompt/{q}?width=1080&height=1920&nologo=true&model=flux&seed={seed}"
                  pr = requests.get(p_url, timeout=25)
                  if pr.status_code == 200 and len(pr.content) > 8000:
                      im = Image.open(io.BytesIO(pr.content)).convert("RGB")
                      print(f"  [Flux Full-Screen AI] Generated unique full-screen scene #{scene_idx+1}", flush=True)
                      return im
              except Exception:
                  pass
              return None

          FAMOUS_MAP = {
              "wall street": "Wall Street New York Stock Exchange trading floor stock boards NYC",
              "nyse": "New York Stock Exchange trading floor stock ticker boards Wall Street",
              "stock exchange": "New York Stock Exchange trading floor electronic stock boards",
              "nasdaq": "Nasdaq MarketSite Times Square New York stock ticker screen",
              "federal reserve": "Federal Reserve Marriner S. Eccles Building Washington DC",
              "the fed": "Federal Reserve building Washington DC US central bank",
              "central bank": "Gold bullion vault bars stacked inside central bank reserve",
              "fort knox": "Fort Knox United States Bullion Depository gold vault bars",
              "gold": "Stacked physical 24k gold bullion bars inside bank vault",
              "asml": "ASML EUV extreme ultraviolet lithography semiconductor machine cleanroom",
              "nvidia": "Nvidia AI data center server racks GPU microchips",
              "silicon valley": "Silicon Valley tech headquarters aerial view California",
              "warren buffett": "Warren Buffett Berkshire Hathaway annual meeting",
              "bitcoin": "Physical Bitcoin coin next to live cryptocurrency trading chart screen",
              "treasury": "US Treasury Bureau of Engraving and Printing hundred dollar bills sheets",
              "inflation": "US hundred dollar bills next to rising supermarket grocery prices",
          }

          def plan_and_fetch_scene_images(sentences, full_script):
              numbered = "\n".join(f"{i+1}. {s}" for i, s in enumerate(sentences))
              plan_prompt = f"""You are the visual director for a viral finance YouTube Short.
          Full script:
          \"\"\"{full_script}\"\"\"

          Sentences to visualize (one unique full-screen image per sentence, NEVER repeat):
          {numbered}

          For each sentence, decide:
          1. If the sentence mentions or implies a famous real-world place, landmark, institution, company, person, or recognizable real entity (e.g., Wall Street, New York Stock Exchange trading boards, Federal Reserve, Fort Knox, ASML, Nvidia, Warren Buffett, US Treasury, gold bullion vault), set "mode" to "web_search" and write a concrete "web_query" that will find an authentic photograph on the internet (e.g., "Wall Street New York Stock Exchange trading floor stock boards NYC").
          2. If the sentence is a general/conceptual statement from the script, set "mode" to "ai_generate" and write a detailed 30-word "ai_prompt" describing the exact full-screen scene illustrating the literal meaning of that sentence (never use vague words like 'moody light' or 'abstract'). Also include a concrete "web_query" as backup.

          Reply ONLY with valid JSON array of objects:
          [{{"mode": "web_search" or "ai_generate", "web_query": "...", "ai_prompt": "..."}}, ...]"""

              planned = []
              try:
                  raw_res = llm.call_llm(
                      prompt=plan_prompt,
                      system="Return ONLY a valid JSON array matching the exact number of sentences.",
                      provider="gemini",
                      max_tokens=1500,
                      temperature=0.2,
                  )
                  m = re.search(r"\[.*\]", str(raw_res), re.DOTALL)
                  if m:
                      planned = json.loads(m.group(0))
              except Exception as e:
                  print(f"  [Scene Planner] Using rule-based script analyzer ({e})", flush=True)

              scene_images = []
              for idx, sent in enumerate(sentences):
                  item = planned[idx] if idx < len(planned) and isinstance(planned[idx], dict) else {}
                  mode = item.get("mode", "ai_generate")
                  web_q = item.get("web_query", "")
                  ai_p = item.get("ai_prompt", "")

                  low_s = sent.lower()
                  for kw, mapped_q in FAMOUS_MAP.items():
                      if kw in low_s:
                          mode = "web_search"
                          if not web_q or len(web_q) < 12:
                              web_q = mapped_q
                          break

                  if not web_q:
                      clean_words = [re.sub(r'[^a-zA-Z0-9]', '', w) for w in sent.split() if len(w) > 3]
                      web_q = " ".join(clean_words[:6]) + " finance economy photo"
                  if not ai_p:
                      ai_p = f"Literal visual illustration of: {sent}"

                  im = None
                  if mode == "web_search":
                      im = search_real_web_image(web_q)
                      if im is None:
                          im = generate_fullscreen_ai_scene(ai_p, full_script, idx)
                  else:
                      im = generate_fullscreen_ai_scene(ai_p, full_script, idx)
                      if im is None:
                          im = search_real_web_image(web_q)

                  if im is None:
                      im = search_real_web_image("Wall Street New York Stock Exchange trading floor boards")
                  if im is None:
                      im = Image.new("RGB", (1080, 1920), (18, 24, 36))
                  scene_images.append(im)
              return scene_images

          def crop_to_fullscreen(bg_img):
              W, H = 1080, 1920
              bw, bh = bg_img.size
              target_ratio = W / float(H)
              src_ratio = bw / float(bh)
              if src_ratio > target_ratio:
                  new_w = int(bh * target_ratio)
                  left = (bw - new_w) // 2
                  cropped = bg_img.crop((left, 0, left + new_w, bh))
              else:
                  new_h = int(bw / target_ratio)
                  top = (bh - new_h) // 2
                  cropped = bg_img.crop((0, top, bw, top + new_h))
              return cropped.resize((W, H), Image.Resampling.BILINEAR).convert("RGBA")

          def render_fullscreen_with_stickman(base_rgba, mouth_state, pose):
              W, H = 1080, 1920
              overlay = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              odraw = ImageDraw.Draw(overlay)

              # Subtle bottom gradient so subtitles and bottom-left stickman stay legible over any full-screen photo
              odraw.rectangle([0, H - 460, W, H], fill=(0, 0, 0, 105))

              # Clean Speaking Stickman in Bottom-Left (NO pop-up boxes or cards!)
              sx, sy = 185, 1310
              head_r = 72
              odraw.ellipse([sx-head_r-4, sy-head_r-4, sx+head_r+4, sy+head_r+4], fill=(18, 22, 32, 235), outline=(0, 0, 0, 220), width=16)
              odraw.ellipse([sx-head_r, sy-head_r, sx+head_r, sy+head_r], fill=(18, 22, 32, 235), outline=(255, 255, 255, 255), width=10)

              odraw.ellipse([sx-32, sy-24, sx-13, sy-2], fill=(255, 255, 255, 255))
              odraw.ellipse([sx+13, sy-24, sx+32, sy-2], fill=(255, 255, 255, 255))
              if pose % 2 == 0:
                  odraw.line([(sx-38, sy-36), (sx-11, sy-30)], fill=(255, 255, 255, 255), width=5)
                  odraw.line([(sx+11, sy-30), (sx+38, sy-36)], fill=(255, 255, 255, 255), width=5)
              else:
                  odraw.line([(sx-38, sy-30), (sx-11, sy-38)], fill=(255, 255, 255, 255), width=5)
                  odraw.line([(sx+11, sy-38), (sx+38, sy-30)], fill=(255, 255, 255, 255), width=5)

              if mouth_state == 0:
                  odraw.arc([sx-22, sy+14, sx+22, sy+34], start=10, end=170, fill=(255, 255, 255, 255), width=6)
              elif mouth_state == 1:
                  odraw.rounded_rectangle([sx-18, sy+18, sx+18, sy+36], radius=8, fill=(235, 85, 85, 255), outline=(255, 255, 255, 255), width=4)
              elif mouth_state == 2:
                  odraw.rounded_rectangle([sx-24, sy+14, sx+24, sy+46], radius=10, fill=(235, 85, 85, 255), outline=(255, 255, 255, 255), width=4)
              else:
                  odraw.ellipse([sx-18, sy+14, sx+18, sy+48], fill=(235, 85, 85, 255), outline=(255, 255, 255, 255), width=4)

              neck_y = sy + head_r
              shoulder_y = neck_y + 32
              hip_y = neck_y + 215

              def draw_limb(pts, w=11):
                  odraw.line(pts, fill=(0, 0, 0, 210), width=w+6)
                  odraw.line(pts, fill=(255, 255, 255, 255), width=w)

              draw_limb([(sx, neck_y), (sx, hip_y)], w=12)
              l_elbow = (sx - 64, shoulder_y + 70)
              l_hand = (sx - 26, shoulder_y + 135) if pose % 2 == 0 else (sx - 86, shoulder_y + 28)
              draw_limb([(sx, shoulder_y), l_elbow, l_hand], w=10)

              r_elbow = (sx + 70, shoulder_y + 42)
              r_hand = (sx + 125, shoulder_y - 20) if mouth_state < 2 else (sx + 135, shoulder_y - 55)
              draw_limb([(sx, shoulder_y), r_elbow, r_hand], w=10)

              draw_limb([(sx, hip_y), (sx - 54, hip_y + 165)], w=12)
              draw_limb([(sx, hip_y), (sx + 54, hip_y + 165)], w=12)

              return Image.alpha_composite(base_rgba, overlay).convert("RGB").tobytes()

          def build_synced_ass_subtitles(mp4_path, script_text, duration_sec, mouth_states, fps, ass_path):
              LEAD_SEC = 0.22
              events = []
              try:
                  import whisper
                  print("  [Subtitles] Extracting exact word timestamps via Whisper...", flush=True)
                  model = whisper.load_model("base")
                  res = model.transcribe(mp4_path, word_timestamps=True)
                  words = []
                  for seg in res.get("segments", []):
                      for w in seg.get("words", []):
                          wt = str(w.get("word", "")).strip()
                          if wt:
                              words.append((float(w.get("start", 0.0)), float(w.get("end", 0.0)), wt))
                  if words:
                      for i in range(0, len(words), 3):
                          grp = words[i:i+3]
                          st = max(0.0, grp[0][0] - LEAD_SEC)
                          et = max(st + 0.22, grp[-1][1] - (LEAD_SEC * 0.5))
                          txt = " ".join(x[2] for x in grp).upper()
                          events.append((st, et, txt))
                      print(f"  [Subtitles] Synced {len(events)} caption chunks with -{LEAD_SEC}s lead offset!", flush=True)
              except Exception as e:
                  print(f"  [Subtitles] Using waveform speech-envelope sync ({e})...", flush=True)

              if not events:
                  spoken_frames = [i for i, m in enumerate(mouth_states) if m > 0]
                  start_sec = max(0.0, (spoken_frames[0] / float(fps)) - 0.12) if spoken_frames else 0.0
                  end_sec = min(duration_sec, (spoken_frames[-1] / float(fps)) + 0.10) if spoken_frames else duration_sec * 0.90
                  active_dur = max(1.0, end_sec - start_sec)

                  all_words = script_text.strip().split()
                  chunks = [" ".join(all_words[i:i+3]).upper() for i in range(0, len(all_words), 3)]
                  weights = [max(3, len(c)) + (4 if any(p in c for p in (".", ",", "?", "!")) else 0) for c in chunks]
                  total_w = float(sum(weights)) or 1.0
                  cur_t = start_sec
                  for c, w in zip(chunks, weights):
                      dur = active_dur * (w / total_w)
                      st = max(0.0, cur_t - LEAD_SEC)
                      et = max(st + 0.20, cur_t + dur - (LEAD_SEC * 0.5))
                      events.append((st, et, c))
                      cur_t += dur

              header = """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Iman,DejaVu Sans,72,&H0040D7FF,&H00FFFFFF,&H00000000,&H80000000,-1,0,0,0,100,100,0,0,1,6,3,2,60,60,150,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """
              def fmt_t(sec):
                  h = int(sec // 3600)
                  m = int((sec % 3600) // 60)
                  s = sec % 60
                  return f"{h}:{m:02d}:{s:05.2f}"

              lines = [header]
              for st, et, txt in events:
                  lines.append(f"Dialogue: 0,{fmt_t(st)},{fmt_t(et)},Iman,,0,0,0,,{txt}")
              with open(ass_path, "w", encoding="utf-8") as f:
                  f.write("\n".join(lines))

          def build_fullscreen_explainer_video(mp4_path, script_text):
              print("  [Visual Engine] Building Full-Screen Script-Matched Visuals + Speaking Stickman...", flush=True)
              FPS = 15
              raw_pcm = subprocess.check_output([
                  "ffmpeg", "-v", "error", "-i", mp4_path,
                  "-ac", "1", "-ar", str(FPS * 200), "-f", "s16le", "-"
              ])
              samples = struct.unpack(f"<{len(raw_pcm)//2}h", raw_pcm)
              total_frames = max(1, len(samples) // 200)
              duration_sec = total_frames / float(FPS)

              mouth_states = []
              for f in range(total_frames):
                  chunk = samples[f*200:(f+1)*200]
                  avg_amp = sum(abs(x) for x in chunk) / max(1, len(chunk))
                  if avg_amp < 450:
                      mouth_states.append(0)
                  elif avg_amp < 1400:
                      mouth_states.append(1)
                  elif avg_amp < 2800:
                      mouth_states.append(2)
                  else:
                      mouth_states.append(3)

              sentences = [s.strip() for s in re.split(r'(?<=[.!?])\s+', script_text.strip()) if s.strip()]
              if not sentences:
                  sentences = [script_text.strip() or "Wall Street and central banks are accumulating physical gold."]

              scene_imgs = plan_and_fetch_scene_images(sentences, script_text)
              fullscreen_rgba_scenes = [crop_to_fullscreen(im) for im in scene_imgs]

              ass_path = "/tmp/stickman_captions.ass"
              build_synced_ass_subtitles(mp4_path, script_text, duration_sec, mouth_states, FPS, ass_path)

              sent_weights = [max(10, len(s)) for s in sentences]
              total_sw = float(sum(sent_weights))
              scene_end_frames = []
              acc = 0.0
              for w in sent_weights:
                  acc += total_frames * (w / total_sw)
                  scene_end_frames.append(int(round(acc)))
              scene_end_frames[-1] = total_frames

              raw_mp4 = "/tmp/stickman_raw.mp4"
              proc = subprocess.Popen([
                  "ffmpeg", "-y", "-v", "error",
                  "-f", "rawvideo", "-pix_fmt", "rgb24", "-s", "1080x1920", "-r", str(FPS), "-i", "-",
                  "-i", mp4_path,
                  "-map", "0:v:0", "-map", "1:a:0",
                  "-c:v", "libx264", "-preset", "ultrafast", "-pix_fmt", "yuv420p",
                  "-c:a", "copy", "-shortest", raw_mp4
              ], stdin=subprocess.PIPE)

              frame_cache = {}
              s_idx = 0
              for f in range(total_frames):
                  while s_idx < len(scene_end_frames) - 1 and f >= scene_end_frames[s_idx]:
                      s_idx += 1
                  m_state = mouth_states[f]
                  key = (s_idx, m_state)
                  if key not in frame_cache:
                      frame_cache[key] = render_fullscreen_with_stickman(fullscreen_rgba_scenes[s_idx], m_state, s_idx)
                  proc.stdin.write(frame_cache[key])
              proc.stdin.close()
              proc.wait()

              subprocess.run([
                  "ffmpeg", "-y", "-v", "error",
                  "-i", raw_mp4,
                  "-vf", f"ass={ass_path}",
                  "-c:v", "libx264", "-preset", "fast", "-pix_fmt", "yuv420p",
                  "-c:a", "copy", mp4_path
              ], check=True)
              print(f"  [Visual Engine] Completed full-screen visual explainer video: {mp4_path}", flush=True)

          sys.argv = ["verticals", "run", "--discover", "--auto-pick", "--niche", "finance", "--provider", "gemini", "--voice", "edge"]
          try:
              main()
          except Exception as e:
              print(f"  [Self-Healing Fallback] Primary pipeline encountered error ({e}), generating Short directly...", flush=True)

          mp4s = sorted(glob.glob(os.path.expanduser("~/.verticals/**/*.mp4"), recursive=True), key=os.path.getmtime)
          drafts = sorted(glob.glob(os.path.expanduser("~/.verticals/drafts/*.json")), key=os.path.getmtime)

          title = "Why Wall Street & Central Banks Buy Physical Gold #Shorts"
          desc = "Visual finance explainer on Wall Street, central banks, inflation, and tangible money. #finance #money #shorts"
          tags = ["finance", "wallstreet", "gold", "investing", "shorts"]
          script_text = (
              "Right now on Wall Street, institutional traders are watching central banks buy physical gold at record speed. "
              "While the Federal Reserve prints trillions in paper currency, everyday savings quietly lose purchasing power to inflation. "
              "Most people have no idea why tangible assets outperform cash during market turmoil. "
              "Inside global bank vaults, physical gold bullion remains the ultimate money you can hold in your hand. "
              "Are you holding cash or real assets right now? Drop your thoughts in the comments."
          )

          if drafts:
              try:
                  with open(drafts[-1]) as f:
                      d = json.load(f)
                      title = d.get("title", title)[:95]
                      desc = d.get("description", d.get("script", desc))
                      tags = d.get("tags", tags)
                      script_text = d.get("script", script_text)
              except Exception:
                  pass

          if not mp4s:
              out_dir = os.path.expanduser("~/.verticals/output")
              os.makedirs(out_dir, exist_ok=True)
              fallback_mp3 = "/tmp/stickman_voice.mp3"
              subprocess.run([
                  sys.executable, "-m", "edge_tts",
                  "--voice", "en-US-AriaNeural",
                  "--text", script_text,
                  "--write-media", fallback_mp3
              ], check=True)
              fallback_mp4 = os.path.join(out_dir, "verticals_stickman_en.mp4")
              subprocess.run([
                  "ffmpeg", "-y", "-v", "error",
                  "-f", "lavfi", "-i", "color=c=black:s=1080x1920:r=15",
                  "-i", fallback_mp3,
                  "-c:v", "libx264", "-preset", "ultrafast", "-pix_fmt", "yuv420p",
                  "-c:a", "aac", "-shortest", fallback_mp4
              ], check=True)
              mp4s = [fallback_mp4]

          mp4_file = mp4s[-1]
          build_fullscreen_explainer_video(mp4_file, script_text)

          # Direct Guaranteed YouTube Upload (Public)
          yt_url = ""
          try:
              from google.oauth2.credentials import Credentials
              from google.auth.transport.requests import Request
              from googleapiclient.discovery import build
              from googleapiclient.http import MediaFileUpload

              tok_path = os.path.expanduser("~/.verticals/youtube_token.json")
              with open(tok_path) as f:
                  td = json.load(f)
              creds = Credentials(
                  token=td.get("token"),
                  refresh_token=td.get("refresh_token"),
                  token_uri=td.get("token_uri", "https://oauth2.googleapis.com/token"),
                  client_id=td.get("client_id"),
                  client_secret=td.get("client_secret"),
              )
              creds.refresh(Request())
              yt = build("youtube", "v3", credentials=creds)
              body = {
                  "snippet": {
                      "title": title,
                      "description": desc + "\n\n#Shorts #Finance #Money",
                      "tags": tags,
                      "categoryId": "27"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              }
              media = MediaFileUpload(mp4_file, chunksize=-1, resumable=True, mimetype="video/mp4")
              req = yt.videos().insert(part="snippet,status", body=body, media_body=media)
              res = None
              while res is None:
                  status, res = req.next_chunk()
              vid_id = res.get("id")
              yt_url = f"https://youtube.com/shorts/{vid_id}"
              print(f"\n==========================================", flush=True)
              print(f"✅ YOUTUBE UPLOAD SUCCESSFUL: {yt_url}", flush=True)
              print(f"==========================================\n", flush=True)
          except Exception as e:
              print(f"\n⚠️ YouTube Direct Upload Error: {e}\n", flush=True)

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          run_url = f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}"
          if summary_file:
              with open(summary_file, "a") as sf:
                  sf.write("## 🎬 Full-Screen Stickman Explainer Short Ready!\n\n")
                  sf.write(f"- **Title:** {title}\n")
                  if yt_url:
                      sf.write(f"- 🔴 **YouTube Short Link (Public):** [{yt_url}]({yt_url})\n")
                  else:
                      sf.write("- ⚠️ **YouTube Status:** Auto-upload skipped/failed — download the MP4 below.\n")
                  sf.write(f"- 📥 **Direct MP4 Video Backup (Artifacts):** [Click here and scroll down to `generated-short-video`]({run_url})\n")
          EOF
          python3 run_bot.py

      - name: Save MP4 Backup for TikTok and YouTube
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-short-video
          path: |
            ~/.verticals/**/*.mp4
            ~/.verticals/**/*.json
