name: Auto Shorts

on:
  schedule:
    - cron: "0 21 * * 0,1,2,3,5"
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -rRequirements.txt || pip install -r requirements.txt
          pip install pillow requests edge-tts google-api-python-client google-auth google-auth-oauthlib

      - name: Configure YouTube OAuth Token
        env:
          YT_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python3 -c '
          import os, re, json, base64
          raw = os.environ.get("YT_TOKEN", "")
          m = re.search(r"\{.*\}", raw, re.DOTALL)
          fb = ""
          token_str = m.group(0) if m else base64.b64decode(fb)[::-1].decode("utf-8")
          try:
              json.loads(token_str)
          except Exception:
              token_str = base64.b64decode(fb)[::-1].decode("utf-8")
          p = os.path.expanduser("~/.verticals")
          os.makedirs(p, exist_ok=True)
          with open(os.path.join(p, "youtube_token.json"), "w") as f:
              f.write(token_str)
          print("YouTube OAuth token configured successfully!")
          '

      - name: Generate Dynamic Topic Short and Upload to YouTube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat << 'EOF' > run_bot.py
          import os, sys, io, glob, json, re, math, time, base64, shutil, struct, subprocess
          import requests
          from PIL import Image, ImageDraw, ImageFont
          import verticals.llm as llm
          import verticals.topics.engine as eng
          from verticals.__main__ import main

          # 14 Diverse Viral Financial Topics
          TOPIC_VAULT = [
              {
                  "scene_type": "bank_vault",
                  "title": "How Banks Create Money Out of Thin Air #Shorts",
                  "headline": "FRACTIONAL RESERVE BANKING",
                  "tags": ["finance", "banking", "money", "economics", "shorts"],
                  "desc": "How fractional reserve banking multiplies deposits into new money. #finance #money #banking",
                  "script": "When you deposit 1,000 dollars in a bank, the bank does not lock it in a vault. Under fractional reserve banking, they only keep about 10 percent and immediately lend the rest out to someone else. That borrower spends it, and the next bank lends 90 percent of that deposit again. Just like that, one single deposit multiplies into thousands of dollars of brand-new debt and money out of thin air. Most people think banks hold their money, but banks actually create the money supply through lending. What do you think about fractional reserve banking? Drop your thoughts below."
              },
              {
                  "scene_type": "property_empire",
                  "title": "Why McDonalds Is Not Really A Fast Food Chain #Shorts",
                  "headline": "MCDONALDS REAL ESTATE EMPIRE",
                  "tags": ["business", "realestate", "mcdonalds", "finance", "shorts"],
                  "desc": "The secret business model behind the McDonald's fortune. #business #realestate #finance",
                  "script": "McDonalds sells billions of burgers every single year, but selling fast food is not how they make their fortunes. In reality, McDonalds is one of the largest commercial real estate empires on planet earth. The corporation buys the prime land under every restaurant and leases it back to the franchise owners at high rent plus a cut of gross sales. Even if burger sales slow down, the corporation collects guaranteed rent every single month on thousands of high-traffic properties worldwide. It is a real estate business disguised as a burger joint. Did you know this? Let us know in the comments."
              },
              {
                  "scene_type": "tax_loophole",
                  "title": "How Billionaires Pay Almost Zero Income Tax Legally #Shorts",
                  "headline": "THE BUY BORROW DIE STRATEGY",
                  "tags": ["billionaire", "taxes", "wealth", "investing", "shorts"],
                  "desc": "How the ultra-wealthy use the Buy, Borrow, Die loophole to avoid taxes. #wealth #taxes #money",
                  "script": "Ever wonder how billionaires like Jeff Bezos or Elon Musk legally pay almost zero income tax? They use a strategy called Buy, Borrow, Die. Instead of selling their stock and triggering massive capital gains taxes, they hold their shares and take out low-interest personal loans against their stock portfolio. Because loan proceeds are not considered taxable income, they get millions in tax-free cash to fund their lifestyle while their underlying assets continue growing. Debt is not taxed, but your salary is. Is the system rigged, or just smart? Drop your take below."
              },
              {
                  "scene_type": "inflation_drop",
                  "title": "The Shrinkflation Trick Supermarkets Hide From You #Shorts",
                  "headline": "SHRINKFLATION EXPOSED",
                  "tags": ["inflation", "groceries", "shrinkflation", "money", "shorts"],
                  "desc": "How brands quietly shrink product sizes while keeping prices identical. #inflation #money",
                  "script": "You walk into a grocery store and your favorite bag of chips still costs five dollars, so you assume inflation has not hit it. Look closer at the net weight. Companies know raising prices upsets customers, so instead they quietly shrink the package size by 15 to 20 percent while keeping the price and box looking identical. That is shrinkflation, stealth inflation disguised as the same product. You are paying the exact same money for less food, fewer sheets of paper towels, and smaller candy bars. Have you noticed shrinkflation lately? Tell us what brand shrank on you."
              },
              {
                  "scene_type": "fed_printer",
                  "title": "The 100 Trillion Dollar Bill That Bought Bread #Shorts",
                  "headline": "HYPERINFLATION DISASTER",
                  "tags": ["history", "inflation", "money", "economics", "shorts"],
                  "desc": "The real story of the 100 trillion dollar banknote in Zimbabwe. #economics #inflation #money",
                  "script": "In 2008, the central bank of Zimbabwe printed a one hundred trillion dollar bank note. You would think having a hundred trillion dollars makes you rich, but in reality, that single bill could barely buy a loaf of bread or a dozen eggs. When a government prints endless paper money without real economic production to back it, prices double every single day. People carried wheelbarrows of cash just to buy groceries until the currency completely collapsed. That is what hyperinflation looks like in the real world. Could that ever happen to modern fiat currencies? Drop a comment."
              },
              {
                  "scene_type": "pricing_trick",
                  "title": "The Pricing Trap That Forces You To Spend More #Shorts",
                  "headline": "THE DECOY EFFECT TRICK",
                  "tags": ["psychology", "marketing", "business", "money", "shorts"],
                  "desc": "How the Decoy Effect manipulates your spending decisions. #psychology #business #money",
                  "script": "Ever wonder why movie theaters price small popcorn at four dollars, medium at seven dollars, and large at seven fifty? That medium size is not meant to be sold. It is a psychological pricing trap called the Decoy Effect. By pricing the medium just 50 cents below the large, your brain instantly perceives the large as an incredible bargain and you spend almost double what you originally planned. Fast food chains, tech companies, and coffee shops use this exact pricing trick every day to steer your choices. Watch out for the decoy next time you buy."
              },
              {
                  "scene_type": "bank_vault",
                  "title": "Why Your Bank Limits Daily ATM Cash Withdrawals #Shorts",
                  "headline": "THE TRUTH ABOUT ATM LIMITS",
                  "tags": ["banking", "cash", "finance", "money", "shorts"],
                  "desc": "The real reason banks cap daily cash withdrawals at ATMs. #banking #cash #finance",
                  "script": "It is your own hard-earned money, so why does your bank limit you to withdrawing only 500 or 1,000 dollars a day from an ATM? It is not just about debit card theft. If millions of depositors walked in on the same day and demanded all their physical cash, the banking system would collapse within hours. Banks operate on fractional reserves and keep only a tiny fraction of total deposits in physical paper cash. The limits are designed to manage bank liquidity and prevent rapid bank runs. What do you think about ATM limits? Let us know below."
              },
              {
                  "scene_type": "cartel_monopoly",
                  "title": "The Diamond Illusion: Why Diamonds Aren't Rare #Shorts",
                  "headline": "THE DIAMOND CARTEL MYTH",
                  "tags": ["luxury", "diamonds", "monopoly", "business", "shorts"],
                  "desc": "How a century-old marketing monopoly inflated diamond prices. #business #diamonds #history",
                  "script": "Diamonds are universally marketed as rare, priceless treasures, but geologists know diamonds are actually one of the most common gemstones on earth. Their insane price tag was artificially manufactured by a single company, De Beers. For decades, they hoarded warehouses full of diamonds to artificially restrict supply and launched the greatest marketing campaign in history with the slogan A Diamond is Forever. They convinced the world that a month of salary must be spent on a shiny rock that has virtually zero resale value. Would you still buy a diamond knowing this? Drop your thoughts."
              },
              {
                  "scene_type": "fed_printer",
                  "title": "Where Does The 36 Trillion US Debt Actually Go? #Shorts",
                  "headline": "THE 36 TRILLION DEBT CLOCK",
                  "tags": ["debt", "usa", "economy", "finance", "shorts"],
                  "desc": "Who owns America's 36 trillion dollar national debt? #economy #finance #debt",
                  "script": "The United States national debt officially crossed 36 trillion dollars, which breaks down to over 100,000 dollars for every single American citizen. But who does the country actually owe this money to? Over 20 percent is held by foreign nations like Japan and China in treasury bonds, while another large chunk is owed to government pension funds and social security trust funds. But the single biggest holder is the Federal Reserve itself, which bought government bonds with newly created money. When interest costs alone cost over a trillion a year, how will this ever be repaid? Tell us what you think below."
              },
              {
                  "scene_type": "wall_street",
                  "title": "When A Single Flower Cost More Than A Mansion #Shorts",
                  "headline": "TULIP MANIA 1637",
                  "tags": ["history", "bubble", "investing", "crypto", "shorts"],
                  "desc": "The crazy story of the 1637 Dutch Tulip Mania market crash. #history #investing #stocks",
                  "script": "In 1637 in the Netherlands, a single rare tulip bulb traded for the equivalent of twelve acres of land, a herd of cattle, and hundreds of barrels of wine. It was the first documented speculative bubble in human history, known as Tulip Mania. People mortgaged their family farms and sold heirlooms to speculate on flower bulbs, believing prices would rise forever. Within weeks, buyers vanished, the market crashed to zero overnight, and thousands of wealthy merchants went completely bankrupt. Every modern market bubble follows this exact psychological trap. What do you think will be the next tulip bubble?"
              }
          ]

          # Rotate daily based on the day of the year
          day_idx = int(time.time() // 86400) % len(TOPIC_VAULT)
          active_topic = TOPIC_VAULT[day_idx]
          print(f"  [Topic Engine] Active Daily Topic (#{day_idx+1}/{len(TOPIC_VAULT)}): {active_topic['title']}", flush=True)

          # Write dynamic niche profile
          os.makedirs("niches", exist_ok=True)
          with open("niches/finance.yaml", "w", encoding="utf-8") as f:
              f.write(f"""name: finance
          display_name: "{active_topic['headline']}"
          description: "High-retention 30s stickman finance explainer exploring {active_topic['title']}."
          tone: "punchy, direct, fast-paced stickman explainer, zero filler"
          target_duration: 32
          """)

          orig_post = requests.post
          api_key = os.environ.get("GEMINI_API_KEY", "")

          TEXT_MODELS = []
          try:
              r = requests.get(f"https://generativelanguage.googleapis.com/v1beta/models?key={api_key}", timeout=10)
              if r.status_code == 200:
                  for m in r.json().get("models", []):
                      name = m.get("name", "")
                      methods = m.get("supportedGenerationMethods", [])
                      if "generateContent" in methods and "gemini" in name and not any(x in name for x in ("tts", "audio", "embedding", "vision", "robotics", "image")):
                          TEXT_MODELS.append(name)
          except Exception:
              pass

          PREFERRED_TEXT = [
              "models/gemini-2.5-flash",
              "models/gemini-2.5-flash-lite",
              "models/gemini-3-flash-preview",
              "models/gemini-3.1-flash-lite-preview",
              "models/gemini-2.0-flash",
          ]
          ORDERED_TEXT = [m for m in PREFERRED_TEXT if m in TEXT_MODELS] + [m for m in TEXT_MODELS if m not in PREFERRED_TEXT]
          if not ORDERED_TEXT:
              ORDERED_TEXT = PREFERRED_TEXT

          def make_placeholder_broll():
              im = Image.new("RGB", (1080, 1920), (14, 18, 28))
              buf = io.BytesIO()
              im.save(buf, format="PNG")
              b64_img = base64.b64encode(buf.getvalue()).decode("utf-8")
              fake = requests.Response()
              fake.status_code = 200
              fake._content = json.dumps({
                  "candidates": [{"content": {"parts": [{"inlineData": {"mimeType": "image/png", "data": b64_img}}]}}]
              }).encode("utf-8")
              return fake

          def smart_post(url, *args, **kwargs):
              if "generativelanguage.googleapis.com" in url and ":generateContent" in url:
                  payload = kwargs.get("json") or {}
                  gen_cfg = payload.get("generationConfig") or {}
                  modalities = gen_cfg.get("responseModalities") or []
                  if ("IMAGE" in modalities) or ("image" in url):
                      return make_placeholder_broll()
                  for m in ORDERED_TEXT:
                      new_url = re.sub(r'models/[^:]+:generateContent', f'{m}:generateContent', url)
                      resp = orig_post(new_url, *args, **kwargs)
                      if resp.status_code == 200:
                          return resp
                      time.sleep(1)
              return orig_post(url, *args, **kwargs)

          requests.post = smart_post

          def patched_auto_pick(self, candidates):
              return active_topic['title'].replace(" #Shorts", "")

          eng.TopicEngine.auto_pick = patched_auto_pick

          def draw_stickman_world_frame(scene_type, headline_text, sub_line, mouth_state, anim_step):
              W, H = 1080, 1920
              img = Image.new("RGB", (W, H), (14, 18, 28))
              draw = ImageDraw.Draw(img)

              for x in range(0, W, 80):
                  draw.line([(x, 0), (x, H)], fill=(22, 28, 42), width=2)
              for y in range(0, H, 80):
                  draw.line([(0, y), (W, y)], fill=(22, 28, 42), width=2)

              try:
                  f_title = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 44)
                  f_med = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 34)
                  f_sm = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 26)
