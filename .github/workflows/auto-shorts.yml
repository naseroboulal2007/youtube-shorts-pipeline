name: Auto Shorts

on:
  schedule:
    - cron: "0 21 * * 0,1,2,3,5"
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Generate and Upload YouTube Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_SECRET_RAW: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YT_VAR_RAW: ${{ vars.YOUTUBE_TOKEN_JSON }}
        run: |
          sed -i "s/\"private\"/\"public\"/g" verticals/*.py || true
          cat << "EOF" > run_bot.py
          import os, re, json, glob, base64, random, sys, urllib.parse, requests
          from verticals.topics.engine import TopicEngine
          import verticals.upload as vu
          import verticals.__main__ as vm

          os.makedirs(os.path.expanduser("~/.verticals"), exist_ok=True)
          gemini_key = os.environ.get("GEMINI_API_KEY", "").strip()
          with open(os.path.expanduser("~/.verticals/config.json"), "w") as cf:
              json.dump({"gemini_api_key": gemini_key}, cf)
          os.chmod(os.path.expanduser("~/.verticals/config.json"), 0o600)

          # 1. Clean or recover YouTube OAuth token automatically
          raw_tok = (os.environ.get("YT_SECRET_RAW") or os.environ.get("YT_VAR_RAW") or "").strip()
          m = re.search(r"\{.*\}", raw_tok, re.DOTALL)
          tok_dict = None
          if m:
              try:
                  tok_dict = json.loads(m.group(0))
              except Exception:
                  tok_dict = None

          if not tok_dict or "refresh_token" not in tok_dict:
              fb = ""
              tok_dict = json.loads(base64.b64decode(fb).decode("utf-8")[::-1])

          token_path = os.path.expanduser("~/.verticals/youtube_token.json")
          with open(token_path, "w") as tf:
              json.dump(tok_dict, tf)
          os.chmod(token_path, 0o600)
          print("YouTube token verified and ready!")

          uploaded_urls = []
          orig_yt_up = vu.upload_to_youtube
          def tracked_yt_up(*a, **kw):
              res = orig_yt_up(*a, **kw)
              if res:
                  uploaded_urls.append(str(res))
              return res
          vu.upload_to_youtube = tracked_yt_up
          vm.upload_to_youtube = tracked_yt_up

          orig_post = requests.post
          orig_get = requests.get

          def is_image_request(url, kwargs):
              body_str = json.dumps(kwargs.get("json") or {})
              return ("IMAGE" in body_str or "imagen" in url.lower() or "image" in url.lower())

          def generate_free_image_response(kwargs):
              body = kwargs.get("json") or {}
              prompt_text = "Financial gold bars and stock market chart, dark moody cinematic lighting, 9:16 vertical"
              try:
                  prompt_text = body["contents"][0]["parts"][0]["text"]
              except Exception:
                  pass
              clean_prompt = urllib.parse.quote(prompt_text[:300])
              seed = random.randint(1, 999999)
              img_url = f"https://image.pollinations.ai/prompt/{clean_prompt}?width=1080&height=1920&nologo=true&seed={seed}"
              try:
                  img_r = orig_get(img_url, timeout=45)
                  if img_r.status_code == 200 and len(img_r.content) > 1000:
                      b64_data = base64.b64encode(img_r.content).decode("utf-8")
                      mock_r = requests.models.Response()
                      mock_r.status_code = 200
                      mock_r._content = json.dumps({
                          "candidates": [{
                              "content": {
                                  "parts": [{
                                      "inlineData": {
                                          "mimeType": "image/jpeg",
                                          "data": b64_data
                                      }
                                  }]
                              }
                          }]
                      }).encode("utf-8")
                      mock_r.headers["Content-Type"] = "application/json"
                      print("  Generated AI B-roll image via Pollinations Flux!")
                      return mock_r
              except Exception as e:
                  print(f"  Pollinations image warning: {e}")
              return None

          def smart_post(url, *args, **kwargs):
              if "generativelanguage.googleapis.com" in url and ":generateContent" in url:
                  if is_image_request(url, kwargs):
                      img_resp = generate_free_image_response(kwargs)
                      if img_resp is not None:
                          return img_resp

                  url = re.sub(r"models/[^:]+:generateContent", "models/gemini-3.5-flash-lite:generateContent", url)
                  r = orig_post(url, *args, **kwargs)
                  if r.status_code == 200:
                      return r
                  print(f"  Primary model returned {r.status_code}, trying backup models...")
                  try:
                      m_resp = orig_get(
                          "https://generativelanguage.googleapis.com/v1beta/models",
                          headers=kwargs.get("headers"),
                          params=kwargs.get("params"),
                          timeout=15
                      )
                      models = []
                      if m_resp.status_code == 200:
                          for m in m_resp.json().get("models", []):
                              name = m.get("name", "")
                              methods = m.get("supportedGenerationMethods", [])
                              if "generateContent" in methods and "gemini" in name:
                                  if not any(x in name for x in ("tts", "image", "vision", "embedding", "robotics", "computer", "thinking", "2.0")):
                                      models.append(name)
                      models.sort(key=lambda x: (0 if "lite" in x else (1 if "flash" in x else 2), x))
                      for m_name in models:
                          alt_url = re.sub(r"models/[^:]+:generateContent", f"{m_name}:generateContent", url)
                          r2 = orig_post(alt_url, *args, **kwargs)
                          if r2.status_code == 200:
                              print(f"  Switched to working Gemini model: {m_name}")
                              return r2
                  except Exception as e:
                      print(f"  Model list lookup warning: {e}")
                  return r
              return orig_post(url, *args, **kwargs)

          requests.post = smart_post

          MONEY_TOPICS = [
              "Why Central Banks Are Secretly Hoarding Physical Gold in 2026",
              "Money You Can Hold vs Digital Cash: What Happens in a Crisis",
              "How Inflation Quietly Steals 50 Percent of Your Savings",
              "Why the Wealthiest Families Buy Tangible Assets Instead of Cash",
              "The Gold Standard Secret Banks Never Teach in School",
              "Why Physical Silver and Gold Outperform Paper Currency Over Time"
          ]

          def free_auto_pick(self, candidates):
              finance_keywords = ("gold", "money", "bank", "market", "stock", "fed", "inflation", "wealth", "invest", "dollar", "debt", "economy", "tariff", "trade", "bond", "silver", "crypto", "fund")
              good = []
              for c in (candidates or []):
                  title = ""
                  for attr in ("title", "headline", "topic", "text"):
                      if hasattr(c, attr) and getattr(c, attr):
                          title = str(getattr(c, attr))
                          break
                      if isinstance(c, dict) and c.get(attr):
                          title = str(c[attr])
                          break
                  if not title:
                      title = str(c)
                  if any(k in title.lower() for k in finance_keywords):
                      good.append(title)
              picked = random.choice(good[:5]) if good else random.choice(MONEY_TOPICS)
              print(f"Auto-picked finance topic: {picked}")
              return picked

          TopicEngine.auto_pick = free_auto_pick

          try:
              sys.argv = ["verticals", "run", "--discover", "--auto-pick", "--niche", "finance", "--provider", "gemini", "--voice", "edge"]
              vm.main()
          except Exception as e:
              print(f"Primary pipeline note: {e}")

          youtube_url = uploaded_urls[0] if uploaded_urls else None
          mp4_files = sorted(glob.glob(os.path.expanduser("~/.verticals/**/*.mp4"), recursive=True), key=os.path.getmtime, reverse=True)
          draft_files = sorted(glob.glob(os.path.expanduser("~/.verticals/drafts/*.json")), key=os.path.getmtime, reverse=True)

          video_title = "Money You Can Hold Explained #shorts"
          video_desc = "Financial insights and tangible assets explained. #finance #money #gold #shorts"
          if draft_files:
              try:
                  d_data = json.load(open(draft_files[0]))
                  video_title = (d_data.get("title") or video_title)[:90]
                  if "#shorts" not in video_title.lower():
                      video_title = f"{video_title} #shorts"
                  video_desc = d_data.get("description") or d_data.get("script") or video_desc
              except Exception:
                  pass

          if mp4_files and not youtube_url:
              try:
                  from google.oauth2.credentials import Credentials
                  from google.auth.transport.requests import Request
                  from googleapiclient.discovery import build
                  from googleapiclient.http import MediaFileUpload

                  creds = Credentials.from_authorized_user_file(token_path)
                  if creds.expired and creds.refresh_token:
                      creds.refresh(Request())
                  yt = build("youtube", "v3", credentials=creds)
                  req = yt.videos().insert(
                      part="snippet,status",
                      body={
                          "snippet": {
                              "title": video_title,
                              "description": video_desc,
                              "tags": ["finance", "money", "gold", "investing", "shorts"],
                              "categoryId": "27"
                          },
                          "status": {
                              "privacyStatus": "public",
                              "selfDeclaredMadeForKids": False
                          }
                      },
                      media_body=MediaFileUpload(mp4_files[0], chunksize=-1, resumable=True)
                  )
                  resp = req.execute()
                  vid_id = resp.get("id")
                  if vid_id:
                      youtube_url = f"https://www.youtube.com/shorts/{vid_id}"
                      print(f"SUCCESS! Uploaded directly to YouTube: {youtube_url}")
              except Exception as up_err:
                  print(f"Direct YouTube upload note: {up_err}")

          direct_mp4_link = None
          if mp4_files:
              latest_mp4 = mp4_files[0]
              try:
                  with open(latest_mp4, "rb") as vf:
                      up_r = orig_post(
                          "https://litterbox.catbox.moe/resources/internals/api.php",
                          data={"reqtype": "fileupload", "time": "72h"},
                          files={"fileToUpload": ("short.mp4", vf, "video/mp4")},
                          timeout=60
                      )
                  if up_r.status_code == 200 and up_r.text.strip().startswith("http"):
                      direct_mp4_link = up_r.text.strip()
                      print(f"Direct Video Link (72h): {direct_mp4_link}")
              except Exception as ex:
                  print(f"Backup link upload note: {ex}")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as sf:
                  sf.write("## 🎬 القاضي النهائي: تقرير إنتاج ورفع الفيديو\n\n")
                  sf.write(f"- **📌 عنوان الفيديو:** `{video_title}`\n")
                  if youtube_url:
                      sf.write(f"- **🔴 رابط الفيديو المنشور على قناتك في يوتيوب:** [{youtube_url}]({youtube_url})\n")
                  else:
                      sf.write("- **📺 حالة يوتيوب:** تفقد قسم `Content > Shorts` في استوديو يوتيوب (`studio.youtube.com`).\n")
                  if direct_mp4_link:
                      sf.write(f"- **🔗 رابط مباشر لمشاهدة وتحميل الفيديو (MP4):** [{direct_mp4_link}]({direct_mp4_link})\n")
                  sf.write("- **📦 ملف الفيديو الكامل:** موجود أيضاً في أسفل هذه الصفحة تحت قسم `Artifacts` باسم `generated-short-video`.\n")
          EOF
          python run_bot.py

      - name: Save MP4 Backup for TikTok
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-short-video
          path: |
            ~/.verticals/**/*.mp4
            ~/.verticals/**/*.json
